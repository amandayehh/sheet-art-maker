<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nova+Mono&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      /* Enable CSS transitions to/from `height: auto`. Used by toggleable
         section bodies so they animate to their natural content height
         instead of needing a hard-coded ceiling. Supported in Chrome 129+. */
      interpolate-size: allow-keywords;

      --space-1: 8px;
      --space-2: 16px;

      --row-height: 32px;
      --icon-size: 10px;
      --icon-slot: 16px;
      --checkbox-size: 16px;
      --paint-bar-padding-block: var(--space-2);

      --font-ui: "Nova Mono", "Apple Color Emoji", "Segoe UI Symbol", "Segoe UI Emoji", "Noto Color Emoji", Arial, sans-serif;
      --font-size: 12px;

      --text-primary: #49454F;
      /* Secondary text: dimmed grey, used for collapsed section headers
         and any other "inactive but readable" state. */
      --text-secondary: #A4A2A7;
      /* Tertiary text: the lightest of the three, primary's RGB at 30%
         alpha so it composites correctly over any background. Used for
         the unchecked checkbox outline and similar near-invisible
         affordances. */
      --text-tertiary: rgba(73, 69, 79, 0.3);
      --primary: #6750A4;
      --primary-soft: #D0BCFF;
      /* Destructive: soft salmon surface for wipe/reset actions (the
         Reset button fill). Edge + text tones are still literals in
         .button--destructive — not yet tokenized. */
      --destructive-soft: #F5B5AF;
      --surface: #FFFFFF;
      /* Surface secondary: subtle off-white used for inset/track UI
         (slider tracks, segmented control backgrounds). No border needed —
         the color difference from --surface alone defines the boundary. */
      --surface-secondary: #E8E6ED;
      /* Page background: pale gray-blue used both behind the panel
         content and on the paint bar so the bar reads as a continuation
         of the page rather than a separately-skinned strip. */
      --background: #f0f4f9;

      --radius-lg: 6px;
      --radius-sm: 4px;
    }

    /* ============================================================
       BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--background);
      border-radius: 0;
    }

    /* Hide the scrollbar entirely. The page remains scrollable via wheel,
       trackpad, touch, and keyboard — only the visible scrollbar chrome is
       suppressed. No gutter, no shift, nothing in the way. */
    html {
      scrollbar-width: none; /* Firefox */
    }
    html::-webkit-scrollbar {
      display: none; /* Chrome / Safari */
    }

    body {
      font-family: var(--font-ui);
      font-size: var(--font-size);
      line-height: 1;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 1px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      /* Reserve scroll space equal to the paint-bar height + a small
         buffer so the last property row clears the bar. The bar has
         two stacked action rows: a 24px clipboard row + the row-height
         paint row, plus the gap between them. Status chip floats
         independently and doesn't need allocation here. */
      padding-bottom: calc(
        1px +
        var(--paint-bar-padding-block) * 2 +
        24px +
        var(--row-height) +
        12px +
        var(--space-2)
      );
    }

    /* ============================================================
       ROW
       ============================================================ */
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-2);
      align-items: center;
      min-height: var(--row-height);
    }

    /* Rows with stacked vertical content: align label to top instead of
       centering against the middle of the stack. */
    .row:has(.row__content--vertical) {
      align-items: flex-start;
    }

    .row__label {
      grid-column: 1;
      min-width: 0;
      min-height: var(--row-height);
      display: flex;
      align-items: center;
    }

    .row__content {
      grid-column: 2 / -1;
      min-width: 0;
      display: flex;
      gap: var(--space-1);
    }

    .row__content--horizontal { flex-direction: row; }
    .row__content--vertical   { flex-direction: column; }

    /* Style-gated rows: a row with `data-style-only="X"` is shown only when
       its closest ancestor section has matching `data-style="X"`. Used by
       the Glyphs section to swap inputs between Binary and Continuous modes
       while preserving each mode's values in the DOM. */
    [data-style="binary"] [data-style-only="continuous"],
    [data-style="continuous"] [data-style-only="binary"] {
      display: none;
    }

    /* Same pattern for the Background section's Paint Style. Rows with
       `data-paint-style-only="checkered"` only show when the section is
       in checkered mode. */
    [data-paint-style="simple"] [data-paint-style-only="checkered"] {
      display: none;
    }

    /* Rows with `data-paint-style-only="centerable"` only show for paint
       styles that have a meaningful center point — Ripple and Sunburst —
       and stay hidden for Simple, Checkered, and the stripe variants. */
    [data-paint-style="simple"] [data-paint-style-only="centerable"],
    [data-paint-style="checkered"] [data-paint-style-only="centerable"],
    [data-paint-style="horizontal"] [data-paint-style-only="centerable"],
    [data-paint-style="vertical"] [data-paint-style-only="centerable"] {
      display: none;
    }

    /* Position row gating: the X/Y inputs only show when "Coordinates"
       is the active mode. Selection mode hides them since the origin is
       resolved server-side from the user's active selection. */
    [data-position-mode="selection"] [data-position-mode-only="coordinates"] {
      display: none;
    }

    /* Palette-mode gating: rows whose meaning depends on a named palette
       being active (e.g. the Mapping checkboxes, which stretch the image's
       L/C/H into the palette's range) hide when the section's palette
       picker has no rows selected. The data attribute is set on the
       enclosing section by wireBgPaletteModal. */
    /* When a section's palette picker is in Spectrum mode, the rows
       gated with data-palette-mode-only="preset" (Mapping checkboxes,
       any preset-only affordances) hide entirely — the user's prior
       settings on those rows are preserved in the DOM, just not
       shown, so flipping back to Preset restores them. */
    [data-palette-mode="spectrum"] [data-palette-mode-only="preset"] {
      display: none;
    }

    /* ============================================================
       DIVIDER
       ============================================================ */
    .divider {
      border: 0;
      border-top: 1px solid var(--surface-secondary);
      margin: var(--space-1) 0;
    }

    /* ============================================================
       ICON
       ============================================================ */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-slot);
      height: var(--icon-slot);
      flex-shrink: 0;
      color: currentColor;
    }

    .icon svg {
      width: var(--icon-size);
      height: var(--icon-size);
      display: block;
    }

    /* Action buttons (paint, reset) carry larger 14px icons to read as
       primary affordances. The .icon slot stays at 16px; only the inner
       SVG scales up. */
    .button--primary .icon svg,
    .button--destructive .icon svg {
      width: 14px;
      height: 14px;
    }

    /* ============================================================
       BUTTON
       ============================================================ */
    .button {
      height: var(--row-height);
      padding: 0 var(--space-1);
      background: var(--surface);
      border: none;
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      overflow: hidden;
      text-transform: inherit;
      letter-spacing: inherit;
    }

    .button:not(.button--primary):not(.button--destructive):not(.button--clipboard):hover {
      outline: 1px solid var(--surface-secondary);
    }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Primary and destructive buttons use larger icons than the rest of
       the UI — they're prominent action affordances, not labels next to
       inputs. Icon slot stays 16px; only the SVG glyph scales up. */
    .button--primary .icon svg,
    .button--destructive .icon svg {
      width: 14px;
      height: 14px;
    }

    .button__filename {
      flex: 1;
      min-width: 0;
      display: flex;
      overflow: hidden;
    }

    .filename__start {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .filename__end {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .button--primary {
      background: var(--primary-soft);
      border: 2px solid #AC94DC;
      color: #4F347D;
      justify-content: center;
      /* Hard offset shadow — 0 blur, solid color block directly below
         the button (no horizontal offset). Hover lifts the button up and
         grows the shadow downward; active presses the button down and
         collapses the shadow. Motion is vertical-only on every state. */
      box-shadow: 0 2px 0 0 #AC94DC;
      transform: translate(0, 0);
      transition: box-shadow 80ms ease, transform 80ms ease;
    }

    .button--primary:hover {
      box-shadow: 0 4px 0 0 #AC94DC;
      transform: translate(0, -2px);
    }

    .button--primary:active {
      box-shadow: 0 0 0 0 #AC94DC;
      transform: translate(0, 2px);
    }

    /* Destructive: salmon/red surface, indicates a wipe/reset action.
       Square icon-only button — same height as primary, but width matches
       its row height so it reads as a compact action chip. Same
       vertical-only shadow / lift behavior as primary. */
    .button--destructive {
      background: var(--destructive-soft);
      border: 2px solid #DD887D;
      color: #7A251E;
      justify-content: center;
      width: var(--row-height);
      flex-shrink: 0;
      padding: 0;
      box-shadow: 0 2px 0 0 #DD887D;
      transform: translate(0, 0);
      transition: box-shadow 80ms ease, transform 80ms ease;
    }

    .button--destructive:hover {
      box-shadow: 0 4px 0 0 #DD887D;
      transform: translate(0, -2px);
    }

    .button--destructive:active {
      box-shadow: 0 0 0 0 #DD887D;
      transform: translate(0, 2px);
    }

    /* ============================================================
       INPUTS
       ============================================================ */
    .input,
    .number-input {
      height: var(--row-height);
      padding: 0 var(--space-1);
      background: var(--surface);
      border: none;
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
    }

    /* Dropdown popup text should always render in the case it's written
       (sentence case from the source). Chrome's native popup sometimes
       picks up the parent select's text-transform: uppercase rather than
       respecting the option's own text-transform, so we set this on
       option and optgroup globally with !important to win over any
       inheritance or browser quirk. The visible select chip still reads
       uppercase via inheritance from body. */
    option,
    optgroup {
      text-transform: none !important;
      letter-spacing: normal !important;
    }

    .input:hover,
    .number-input:hover {
      outline: 1px solid var(--surface-secondary);
    }

    .input:focus,
    .number-input:focus {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    .input { width: 100%; }

    .number-input {
      width: 56px;
      flex-shrink: 0;
      /* 1px extra left padding so text-start aligns with where the icon
         would be in an input with a prefix. */
      padding-left: calc(var(--space-1) + 1px);
    }

    /* Iconless input-group inputs (no prefix sibling): same alignment */
    .input-group__input:first-child {
      padding-left: calc(var(--space-1) + 1px);
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ============================================================
       SELECT SHELL — a native <select> made invisible and overlaid by
       a custom chip, the same pattern the palette picker uses. A native
       <select> applies a single text-transform to BOTH its chip and its
       popup, and the popup ignores per-<option> text-transform, so the
       two cases can't be split on a plain <select>. Here the real select
       is transparent and set to text-transform: none — its popup renders
       option text in source (sentence) case — while the visible
       .select-shell__value chip inherits the panel's uppercase styling.
       ============================================================ */
    .select-shell {
      position: relative;
      width: 100%;
      height: var(--row-height);
    }

    .select-shell__value {
      display: flex;
      align-items: center;
      height: 100%;
      /* Right padding clears the chevron: space-1 gutter + icon + space-1. */
      padding: 0 calc(var(--space-1) + var(--icon-size) + var(--space-1)) 0 var(--space-1);
      background: var(--surface);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-shell__chevron {
      position: absolute;
      right: var(--space-1);
      top: 50%;
      transform: translateY(-50%);
      width: var(--icon-size);
      height: var(--icon-size);
      pointer-events: none;
    }

    .select-shell__chevron svg {
      width: var(--icon-size);
      height: var(--icon-size);
      display: block;
    }

    /* The real <select>: full-bleed and transparent over the chip.
       opacity: 0 hides its own chip rendering; text-transform: none keeps
       its popup in source case regardless of the inherited uppercase. */
    .select-shell__select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font: inherit;
      text-transform: none;
    }

    .select-shell:hover .select-shell__value {
      outline: 1px solid var(--surface-secondary);
    }

    /* Keyboard-only focus ring, gated on the .kbd-focus class the
       modality tracker adds to the overlaid <select> — same approach as
       the palette picker (see wireSelectFocusModality). */
    .select-shell:has(.select-shell__select.kbd-focus) .select-shell__value {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    /* ============================================================
       PALETTE PICKER — collapsed state shows swatch preview,
       opens to full select on click.
       ============================================================ */
    .palette-picker {
      position: relative;
      width: 100%;
      height: var(--row-height);
    }

    .palette-picker__display {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-1);
      height: 100%;
      padding: 0 var(--space-1);
      background: var(--surface);
      border-radius: var(--radius-lg);
      cursor: pointer;
      overflow: hidden;
    }

    /* Hover and focus outlines trigger on the wrapper, not the chip
       itself — the invisible <select> overlay is a sibling of the chip
       (both children of .palette-picker), so hovering the picker means
       hovering the select, not the chip. Listening on the wrapper picks
       up both cases. */
    .palette-picker:hover .palette-picker__display {
      outline: 1px solid var(--surface-secondary);
    }

    /* Keyboard-only focus ring on the chip, gated on the .kbd-focus class
       the modality tracker adds to the overlaid <select> (see .select
       above). The invisible select's own UA outline is hidden by its
       opacity: 0, so this chip outline is the only one ever seen. */
    .palette-picker:has(.palette-picker__select.kbd-focus) .palette-picker__display {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    .palette-picker__swatches {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      overflow: hidden;
      height: 100%;
    }

    .palette-picker__swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .palette-picker__swatch--light {
      box-shadow: inset 0 0 0 0.5px var(--surface-secondary);
    }

    .palette-picker__chevron {
      flex-shrink: 0;
      width: var(--icon-size);
      height: var(--icon-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .palette-picker__chevron svg {
      width: var(--icon-size);
      height: var(--icon-size);
      display: block;
    }

    .palette-picker__select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font: inherit;
      /* Popup renders option text in source (sentence) case — the native
         popup follows the select's transform, not the chip's. The chip
         here is the separate .palette-picker__display, so there's no
         uppercase to preserve on the select itself. */
      text-transform: none;
    }

    /* Border-style preview: drawn line inside the picker chip. Fills the
       middle area between the (absent) leading icon and the chevron.
       Lines themselves are children built in JS per the selected style —
       single line, double line, or dashed/dotted gradient lines. No
       horizontal padding here: the parent .palette-picker__display
       already provides --space-1 padding on both sides, matching the
       other dropdowns' swatch alignment exactly. */
    .border-style-preview {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 2px;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Single line variant: full-width div, height varies by style.
       Dashed/dotted use a repeating-linear-gradient background applied
       inline rather than child segments, so the pattern tiles to the
       full width of the chip. */
    .border-style-preview__line {
      width: 100%;
      background: currentColor;
    }

    /* ============================================================
       Modal-variant palette picker (currently: bg palette only)

       The .display chip is a real <button> here instead of a div with
       an invisible <select> overlay. Click opens .palette-modal as a
       floating panel directly below the chip. Multiple rows can be
       checked; the active palette is the union of all checked rows'
       colors. Click outside the modal closes it.
       ============================================================ */
    .palette-picker--modal {
      /* allow_overflow: the modal is position:absolute on the picker,
         and Sheets sidebars don't trap z-index across rows — making the
         picker the positioning context keeps the modal anchored. */
      position: relative;
    }
    .palette-picker__display--button {
      width: 100%;
      border: none;
      font: inherit;
      color: inherit;
      text-align: left;
      letter-spacing: inherit;
      text-transform: inherit;
    }
    .palette-picker__display--button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }
    /* Open-state chevron rotation matches the chip's affordance —
       points up when the modal is open. */
    .palette-picker--modal[data-open="true"] .palette-picker__chevron {
      transform: rotate(180deg);
    }

    /* Click-blocking scrim that sits behind the open palette modal
       and in front of everything else. A single shared element handles
       all five pickers since only one modal is open at a time. The
       scrim itself is transparent so it doesn't visually obscure
       anything; its job is just to catch the click that should close
       the modal and prevent it from reaching whatever's beneath
       (toggles, swatches in other rows, etc). */
    .palette-modal-scrim {
      position: fixed;
      inset: 0;
      z-index: 19;
      background: transparent;
    }

    .palette-modal {
      position: fixed;
      /* top set in JS from the button's getBoundingClientRect on each
         open — fixed positioning means we anchor to the iframe viewport
         (= the sidebar) rather than the picker container. Right edge
         pinned to the sidebar; width hugs content (no explicit left or
         width, so the box shrinks to fit). z-index above the scrim
         so clicks land on the modal content; the scrim catches the
         rest of the viewport.

         Padding is 0 at the shell so the tab strip can sit flush at
         the top (with the modal's rounded TL/TR corners). The Preset
         and Spectrum bodies each carry their own 16px padding. */
      right: 0;
      z-index: 20;
      padding: 0;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 0 0 var(--surface-secondary);
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;  /* clips the tab strip's outer corners to the modal radius */
    }

    /* TAB STRIP — Preset / Spectrum mode switcher at the top of the
       modal. Two tab buttons with a single sliding indicator that
       carries concave bottom corners (via pseudo-elements with
       radial gradients), so the active tab visually "tabs into" the
       body below. Same animation shape as the segmented control:
       indicator slides horizontally; per-tab text just dims when
       inactive. */
    .palette-modal__tabs {
      position: relative;
      display: flex;
      height: var(--row-height);
      background: var(--surface-secondary);
      flex-shrink: 0;
    }
    /* Sliding white panel. Width = 50% of the strip (two tabs); left
       edge is animated via translateX driven by --tab-index on the
       strip (0 for Preset, 1 for Spectrum). Top corners curve to
       match the modal's outer radius; bottom is flat — the curves
       attached via pseudo-elements on the sides give the concave
       look that the inactive tab's grey background fills against. */
    .palette-modal__tab-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: translateX(calc(var(--tab-index, 0) * 100%));
      transition: transform 220ms ease-in-out;
      pointer-events: none;
    }
    /* Left concave corner. The gradient is centered at the indicator's
       bottom-left point; everything inside a small circle of radius
       --radius-lg is transparent (the grey strip shows through and
       reads as the inactive area curving outward), and beyond that
       radius the gradient fills with the body's white so the eye
       reads the white as continuing under the indicator. The
       +0.5px past the radius kills sub-pixel hairlines that some
       browsers render at the boundary. */
    .palette-modal__tab-indicator::before,
    .palette-modal__tab-indicator::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: var(--radius-lg);
      height: var(--radius-lg);
    }
    .palette-modal__tab-indicator::before {
      left: calc(-1 * var(--radius-lg));
      background: radial-gradient(
        circle at top left,
        transparent var(--radius-lg),
        var(--surface) calc(var(--radius-lg) + 0.5px)
      );
    }
    .palette-modal__tab-indicator::after {
      right: calc(-1 * var(--radius-lg));
      background: radial-gradient(
        circle at top right,
        transparent var(--radius-lg),
        var(--surface) calc(var(--radius-lg) + 0.5px)
      );
    }
    /* Tab button: half the strip width, font-mono uppercase, dimmed
       when inactive. position: relative pushes it above the
       indicator in the z-stack so clicks register on the button
       rather than the indicator's pointer-events:none surface. */
    .palette-modal__tab {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      opacity: 0.5;
      transition: opacity 180ms;
    }
    .palette-modal__tab[aria-selected="true"] {
      opacity: 1;
    }

    /* Bodies — Preset shows the existing row picker; Spectrum shows
       an explanation block. Only one is visible at a time, driven by
       data-palette-mode on the modal. Padding lives here (16px)
       rather than on the modal shell so the tab strip can sit flush. */
    .palette-modal__body {
      padding: var(--space-2);
    }
    .palette-modal[data-palette-mode="preset"]   .palette-modal__body--spectrum,
    .palette-modal[data-palette-mode="spectrum"] .palette-modal__body--preset {
      display: none;
    }
    /* Spectrum explanation row sized to a single row-height line, so
       the modal is meaningfully shorter than the multi-row preset
       body — visual confirmation that the mode changed. */
    .palette-modal__spectrum-info {
      display: flex;
      align-items: center;
      min-height: var(--row-height);
      color: var(--text-primary);
      font-size: var(--font-size);
      line-height: 1.4;
      max-width: 280px;
    }
    /* Chip preview when a section is in Spectrum mode: hue gradient
       strip replacing the discrete swatch dots. Reuses the chip's
       sizing so the section-level visual swaps cleanly when the
       user toggles modes inside the modal. */
    .palette-chip__spectrum {
      width: 100%;
      height: 8px;
      border-radius: var(--radius-sm);
      background: linear-gradient(
        to right,
        #ff3b30, #ff9500, #ffcc00, #34c759,
        #00c7be, #007aff, #5856d6, #af52de, #ff2d55, #ff3b30
      );
    }
    /* Each row: 32px tall, checkbox on the left, swatches occupying the
       rest of the width. The 8px is the gap between the checkbox column
       and the swatch strip; the row itself has no internal padding so
       the modal's own 16px padding defines the horizontal margins. */
    .palette-modal__row {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      height: 32px;
    }
    .palette-modal__row .checkbox {
      flex-shrink: 0;
      padding-left: 0;
      height: 100%;
    }
    .palette-modal__swatches {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      /* 8px gap clears the 3px-per-side selected ring (1px outline-
         offset + 2px outline) on both adjacent swatches, with 2px of
         visible space between rings rather than them touching at the
         seam. */
      gap: var(--space-1);
    }
    .palette-modal__swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      padding: 0;
      border: none;
      cursor: pointer;
      /* Outline used for the selected-state ring (see --selected below);
         declared here so transitions are smooth in case we ever animate. */
      outline: 2px solid transparent;
      outline-offset: 1px;
    }
    /* Selected individual swatch: 2px primary-colored ring with a 1px
       gap to the swatch edge. Rendered via outline + outline-offset so
       it doesn't take up flow space and clean-renders the circular
       shape since modern Chrome respects border-radius for outline. */
    .palette-modal__swatch--selected {
      outline-color: var(--primary);
    }
    /* Light swatches get an inner stroke so near-white circles don't
       vanish into the modal background. Matches the chip's small-swatch
       treatment for consistency. */
    .palette-modal__swatch--light {
      box-shadow: inset 0 0 0 0.5px var(--surface-secondary);
    }

    /* Input group: prefix + bare input share one borderless shell */
    .input-group {
      display: flex;
      align-items: center;
      height: var(--row-height);
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      min-width: 0;
    }

    .row__content--horizontal > .input-group { flex: 1; }

    .input-group:hover {
      outline: 1px solid var(--surface-secondary);
    }

    .input-group:focus-within {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    .input-group__prefix {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-slot);
      margin-left: var(--space-1);
      color: currentColor;
    }

    .input-group__prefix svg {
      width: var(--icon-size);
      height: var(--icon-size);
      display: block;
    }

    /* Input that follows a prefix has no extra left padding (gap is from prefix margin) */
    .input-group__prefix + .input-group__input {
      padding-left: var(--space-1);
    }

    .input-group__input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      background: transparent;
      font: inherit;
      color: inherit;
      padding: 0 var(--space-1);
      text-transform: inherit;
      letter-spacing: inherit;
    }

    .input-group__input:focus { outline: none; }

    /* URL input: placeholder is uppercase via inheritance, typed value preserves casing */
    #urlInput:not(:placeholder-shown) {
      text-transform: none;
      letter-spacing: 0;
    }

    /* Glyph inputs preserve casing/exact characters */
    .glyph-input {
      text-transform: none;
      letter-spacing: 0;
    }

    /* ============================================================
       SLIDER
       ============================================================ */
    .slider {
      flex: 1;
      min-width: 0;
      height: var(--row-height);
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .slider__track {
      position: relative;
      width: 100%;
      height: var(--row-height);
      padding: 2px;
      background: var(--surface-secondary);
      border-radius: var(--radius-lg);
    }

    .slider__fill {
      display: none;
    }

    /* Thumb mirrors the segmented control's indicator: pinned with
       top/bottom: 2px so its height is implicit (track height − 4px),
       horizontally positioned by JS via `left` against the track's
       padding box. No transform centering — `left` names the thumb's
       left edge, which keeps the math straightforward at the
       extremes. */
    .slider__thumb {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 0;
      width: 6px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      pointer-events: none;
    }

    /* Snap-point marker — a small dot at a designated default value on the
       track. The thumb sits on top when at the snap point and hides it; when
       elsewhere, this acts as a visual hint of where to return to. */
    .slider__snap-marker {
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      background: var(--text-primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ============================================================
       CHECKBOX
       ============================================================ */
    /* Checkboxes are sized to match the section toggle (16px). The
       padding-left and gap are var(--space-1) (8px), which puts the
       checkbox icon center at 16px from the row's left — same as the
       icon inside .input-group__prefix — and starts the label text at
       32px, matching the input value column. */
    .checkbox {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      padding-left: var(--space-1);
      height: var(--row-height);
      cursor: pointer;
    }

    .checkbox__input {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .checkbox__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--checkbox-size);
      height: var(--checkbox-size);
      flex-shrink: 0;
      /* currentColor drives the SVG: stroke for the unchecked outline,
         fill for the checked rect. Default = tertiary (the muted state),
         primary on checked = same purple as the section toggle's active
         state, so all "active" affordances share one color. */
      color: var(--text-tertiary);
    }

    .checkbox__input:checked ~ .checkbox__icon,
    .checkbox__input:indeterminate ~ .checkbox__icon {
      color: var(--primary);
    }

    .checkbox__svg {
      width: var(--checkbox-size);
      height: var(--checkbox-size);
      display: block;
    }

    .checkbox__svg--checked,
    .checkbox__svg--mixed { display: none; }
    .checkbox__input:checked ~ .checkbox__icon .checkbox__svg--unchecked { display: none; }
    .checkbox__input:checked ~ .checkbox__icon .checkbox__svg--checked { display: block; }
    /* Indeterminate (mixed) state: some swatches in this row are
       selected but not all. The mixed icon (a filled square with a
       horizontal bar) replaces both unchecked and checked. */
    .checkbox__input:indeterminate ~ .checkbox__icon .checkbox__svg--unchecked { display: none; }
    .checkbox__input:indeterminate ~ .checkbox__icon .checkbox__svg--mixed { display: block; }

    .checkbox__input:focus-visible ~ .checkbox__icon {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ============================================================
       SEGMENTED CONTROL — bordered shell with N equal-width chips
       and a single sliding indicator pill that animates between
       positions. The indicator's position is driven by a CSS var
       (--seg-index) set on the shell by JS.
       ============================================================ */
    .segmented {
      --seg-count: 2;
      --seg-index: 0;
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: var(--row-height);
      padding: 2px;
      background: var(--surface-secondary);
      border-radius: var(--radius-lg);
    }

    /* Sliding indicator. Width = 1/N of the inner area, position driven
       by --seg-index. Uses transform for GPU-accelerated animation.
       Indicator radius is --radius-sm — shared with the slider thumb
       so all inner "selected" rectangles read at the same crispness. */
    .segmented__indicator {
      position: absolute;
      top: 2px;
      left: 2px;
      bottom: 2px;
      width: calc((100% - 4px) / var(--seg-count));
      background: var(--surface);
      border-radius: var(--radius-sm);
      transform: translateX(calc(var(--seg-index) * 100%));
      transition: transform 220ms ease-in-out;
      pointer-events: none;
    }

    .segmented__option {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      z-index: 1;
    }

    .segmented__input {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .segmented__chip {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      cursor: pointer;
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      transition: color 120ms ease;
    }

    /* Unchecked chips dim to secondary text color. SVG icons inside
       inherit via currentColor (fill="currentColor" on the path), so
       this affects both text-only chips and icon-only chips. On hover,
       the unchecked chip lifts back to primary text color — no bg
       change, just a color shift. The color transition on .segmented__chip
       handles the animation. */
    .segmented__input:not(:checked) ~ .segmented__chip {
      color: var(--text-secondary);
    }

    .segmented__input:not(:checked) ~ .segmented__chip:hover {
      color: var(--text-primary);
    }

    .segmented__input:focus-visible ~ .segmented__chip {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    /* ============================================================
       SECTION — feature group with optional collapsible body.
       Two variants:
         .section            — toggleable, has +/− indicator,
                               dimmed when collapsed
         .section--static    — always expanded, no toggle, no
                               indicator, used for permanent groups
       State driven by a hidden checkbox (.section__toggle):
         unchecked = collapsed + dimmed, body hidden
         checked   = expanded + active, body shown
       The whole header is the click target (clicking the label).
       ============================================================ */
    .section {
      display: flex;
      flex-direction: column;
    }

    .section__toggle {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .section__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--row-height);
      user-select: none;
      color: var(--text-primary);
    }

    /* Toggleable sections: header acts as a button. When collapsed, header
       reads in --text-secondary (dimmed). On hover or when expanded, lifts
       to --text-primary like the rest of the UI. */
    .section:not(.section--static) .section__header {
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 120ms ease;
    }

    .section:not(.section--static) .section__header:hover,
    .section__toggle:checked ~ .section__header {
      color: var(--text-primary);
    }

    .section__title {
      flex: 1;
      min-width: 0;
    }

    /* Toggle switch indicator on the right side of toggleable section
       headers. Pill-shaped track with a circular thumb that slides between
       the two ends. Replaces the older +/- icon system. */
    .section__indicator {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      width: 28px;
      height: 16px;
      border-radius: 999px;
      background: var(--surface-secondary);
      position: relative;
      transition: background-color 200ms ease;
    }

    .section__indicator__thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      transition: transform 200ms ease;
    }

    .section__toggle:checked ~ .section__header .section__indicator {
      background: var(--primary);
    }

    .section__toggle:checked ~ .section__header .section__indicator__thumb {
      transform: translateX(12px);
    }

    .section__toggle:focus-visible ~ .section__header {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .section__body {
      flex-direction: column;
      gap: var(--space-1);
    }

    /* Toggleable section body: animates between height 0 and the natural
       content height. Requires `interpolate-size: allow-keywords` on a
       root container so transitions to/from `auto` work; declared on :root
       below. Avoids the max-height-with-arbitrary-ceiling problem where the
       visible animation finishes much earlier than the declared duration.
       min-height: 0 is required so flex's default min-height: auto doesn't
       leave a 1px residue when the body collapses — flex items can't
       shrink below their content's intrinsic size without it. */
    .section:not(.section--static) .section__body {
      display: flex;
      height: 0;
      min-height: 0;
      overflow: hidden;
      margin-top: 0;
      transition: height 250ms ease, margin-top 250ms ease;
    }

    .section__toggle:checked ~ .section__body {
      height: auto;
      margin-top: var(--space-1);
    }

    /* Static: body always visible, with header-to-body spacing baked in */
    .section--static .section__body {
      display: flex;
      margin-top: var(--space-1);
    }

    /* ============================================================
       PAINT BAR
       ============================================================ */
    .paint-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      /* Above every in-flow element. Segmented controls' options use
         z-index: 1 (creating their own stacking contexts in the root),
         so a fixed bar with no z-index would paint UNDER them during
         scroll. z-index: 10 is plenty since nothing else competes here. */
      z-index: 10;
      padding: var(--paint-bar-padding-block) 0;
      background: var(--background);
      border-top: 1px solid var(--surface-secondary);
      display: flex;
      flex-direction: column;
    }

    /* Action row inside paint bar: primary Paint button + compact reset
       button. Paint takes remaining space, reset is fixed-size square.
       2px right inset keeps the destructive button's hover shadow from
       clipping at the viewport edge. */
    .paint-bar__actions {
      display: flex;
      gap: 12px;
      padding-right: 2px;
    }

    /* Secondary action row that sits above the Paint row — Copy / Paste
       shape, our workaround for Sheets' inability to copy non-contiguous
       selections. Two equal-width chips with smaller visual weight than
       the primary action, separated from the Paint row by a hair of
       breathing room. */
    .paint-bar__clipboard {
      display: flex;
      gap: 12px;
      padding-right: 2px;
      margin-bottom: 12px;
    }

    /* Shared shape for the clipboard chips: 24px tall, 4px radius, 4px
       gap between icon and label. Shadow / border / lift mechanics match
       the Paint and Reset buttons exactly — 2px solid border, 2px
       resting vertical shadow that grows to 4px on hover (button lifts
       2px up) and collapses on press (button drops 2px down). Color
       variants (--copy, --paste) layer palette-specific border, bg,
       text, and shadow tones on top. */
    .button--clipboard {
      flex: 1;
      height: 24px;
      padding: 4px var(--space-1);
      gap: 4px;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      transform: translate(0, 0);
      transition: box-shadow 80ms ease, transform 80ms ease;
    }
    /* These chips use 10×10 SVGs directly — no extra slot padding around
       them, so the gap reads as a clean 4px between glyph and label. */
    .button--clipboard .icon,
    .button--clipboard .icon svg {
      width: 10px;
      height: 10px;
    }
    .button--clipboard:disabled {
      background: #F0F0F0;
      border-color: #D7D7D7;
      color: #B4B4B4;
      box-shadow: 0 2px 0 0 #D7D7D7;
      cursor: default;
      opacity: 1;
    }

    .button--copy {
      background: #A6CAFF;
      border-color: #7CA3E5;
      color: #1D4386;
      box-shadow: 0 2px 0 0 #7CA3E5;
    }
    .button--copy:hover:not(:disabled) {
      box-shadow: 0 4px 0 0 #7CA3E5;
      transform: translate(0, -2px);
    }
    .button--copy:active:not(:disabled) {
      box-shadow: 0 0 0 0 #7CA3E5;
      transform: translate(0, 2px);
    }

    .button--paste {
      background: #93DCB1;
      border-color: #65B789;
      color: #00582B;
      box-shadow: 0 2px 0 0 #65B789;
    }
    .button--paste:hover:not(:disabled) {
      box-shadow: 0 4px 0 0 #65B789;
      transform: translate(0, -2px);
    }
    .button--paste:active:not(:disabled) {
      box-shadow: 0 0 0 0 #65B789;
      transform: translate(0, 2px);
    }

    /* Floating status chip. Straddles the paint bar's top edge,
       overlapping 4px down into the bar so it visually anchors to the
       seam between the panel and the bar. Icon sits left of the text
       with a small gap; left padding is tighter than right to balance
       the icon's visual weight. Hidden via :empty when there's no
       message so it doesn't paint a bare invisible box. */
    .status {
      position: fixed;
      bottom: calc(var(--paint-bar-padding-block) * 2 + 24px + var(--row-height) + 12px + 1px - 4px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      max-width: calc(100% - 32px);
      /* Grows to fit its message: short statuses stay a compact one-line
         pill, longer ones (e.g. error text) wrap and the box grows down.
         Capped at 320px tall, after which it scrolls rather than running
         off the top of the bar. Icon pins to the first line so multi-line
         messages don't float it in the vertical middle. */
      max-height: 320px;
      overflow-x: hidden;
      overflow-y: auto;
      display: inline-flex;
      align-items: flex-start;
      gap: var(--space-1);
      padding: 6px 10px 6px var(--space-1);
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 999px;
      box-shadow: 0 2px 8px 0 rgba(73, 69, 79, 0.25);
      pointer-events: none;
    }
    .status:empty { display: none; }

    .status__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 10px;
      height: 10px;
    }
    .status__icon svg {
      width: 10px;
      height: 10px;
      display: block;
    }

    /* Pending icon spins continuously. transform-origin defaults to
       center for SVG, which is what we want here. */
    @keyframes status-spin {
      to { transform: rotate(360deg); }
    }
    .status__icon--pending svg {
      animation: status-spin 1s linear infinite;
    }

    .status__text {
      min-width: 0;
      /* Break long unbroken tokens (URLs, IDs in error text) so they wrap
         inside the pill instead of forcing horizontal overflow. */
      overflow-wrap: anywhere;
    }

    /* ============================================================
       UTILITY
       ============================================================ */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    [hidden] { display: none !important; }
  </style>
</head>

  <div class="panel">
    <!-- SET UP (always visible) -->
    <div class="section section--static">
      <div class="section__header">
        <span class="section__title">Set up</span>
      </div>
      <div class="section__body">
        <!-- IMAGE -->
        <div class="row">
          <span class="row__label">Image</span>
          <div class="row__content row__content--vertical">
            <button class="button" id="uploadBtn" type="button">
              <span class="icon"><svg><use href="#icon-upload"/></svg></span>
              <span class="button__filename" id="uploadLabel">Upload image</span>
            </button>
            <div class="input-group">
              <span class="input-group__prefix"><svg><use href="#icon-link"/></svg></span>
              <input type="text" id="urlInput" class="input-group__input" placeholder="Enter URL" autocomplete="off" spellcheck="false">
            </div>
            <input type="file" id="fileInput" accept="image/*" class="visually-hidden">
          </div>
        </div>

        <!-- POSITION -->
        <div class="row" id="positionRow" data-position-mode="selection">
          <span class="row__label">Position</span>
          <div class="row__content row__content--vertical">
            <div class="segmented" role="radiogroup" aria-label="Position mode">
              <span class="segmented__indicator" aria-hidden="true"></span>
              <label class="segmented__option">
                <input type="radio" class="segmented__input" name="positionMode" value="selection" checked>
                <span class="segmented__chip">Selection</span>
              </label>
              <label class="segmented__option">
                <input type="radio" class="segmented__input" name="positionMode" value="coordinates">
                <span class="segmented__chip">Manual</span>
              </label>
            </div>
            <div class="row__content row__content--horizontal" data-position-mode-only="coordinates">
              <div class="input-group">
                <span class="input-group__prefix"><svg><use href="#icon-x"/></svg></span>
                <input type="text" id="posX" value="A" class="input-group__input" autocomplete="off" spellcheck="false">
              </div>
              <div class="input-group">
                <span class="input-group__prefix"><svg><use href="#icon-y"/></svg></span>
                <input type="number" id="posY" value="1" min="1" class="input-group__input">
              </div>
            </div>
          </div>
        </div>

        <!-- SIZE -->
        <div class="row">
          <span class="row__label">Size</span>
          <div class="row__content row__content--horizontal">
            <div class="slider" id="sizeSlider"></div>
            <input type="number" class="number-input" id="sizeInput" min="1" max="400" value="30">
          </div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- BACKGROUND (toggleable section, on by default) -->
    <div class="section" id="bgSection" data-paint-style="simple">
      <input type="checkbox" class="section__toggle" id="bgToggle" checked>
      <label class="section__header" for="bgToggle">
        <span class="section__title">Background</span>
        <span class="section__indicator">
          <span class="section__indicator__thumb"></span>
        </span>
      </label>
      <div class="section__body">
        <!-- PALETTE -->
        <div class="row">
          <span class="row__label">Palette</span>
          <div class="row__content row__content--vertical">
            <div class="palette-picker palette-picker--modal" id="bgPalettePicker">
              <button type="button" class="palette-picker__display palette-picker__display--button" id="bgPaletteButton" aria-haspopup="dialog" aria-expanded="false">
                <div class="palette-picker__swatches" id="bgPaletteSwatches"></div>
                <span class="palette-picker__chevron"><svg><use href="#icon-chevron-down"/></svg></span>
              </button>
              <div class="palette-modal" id="bgPaletteModal" role="dialog" aria-label="Background palette rows" hidden></div>
            </div>
          </div>
        </div>

        <!-- BLANK AREAS: how cells whose source pixel reads as blank
             (transparent or near-white) are handled.
               Skip — leave the cell's existing bg untouched. The
                      classic cutout/transparent-background behavior;
                      what the old "Hide on blank areas" checkbox did
                      when checked.
               Fill — paint a primary-palette match into the cell
                      anyway, like every other pixel. Useful when
                      you want the whole rectangle filled even
                      across transparent regions.
             Internally the rest of the pipeline still keys off a
             single boolean (bgHideOnBlank), set from this radio's
             "skip" value. -->
        <div class="row">
          <span class="row__label">Blank areas</span>
          <div class="row__content row__content--horizontal">
            <div class="segmented" role="radiogroup" aria-label="Background blank areas">
              <span class="segmented__indicator" aria-hidden="true"></span>
              <label class="segmented__option">
                <input type="radio" class="segmented__input" name="bgBlankAreas" value="skip" checked>
                <span class="segmented__chip">Skip</span>
              </label>
              <label class="segmented__option">
                <input type="radio" class="segmented__input" name="bgBlankAreas" value="fill">
                <span class="segmented__chip">Fill</span>
              </label>
            </div>
          </div>
        </div>

        <!-- SAMPLING -->
        <!-- PAINT STYLE -->
        <div class="row">
          <span class="row__label">Style</span>
          <div class="row__content row__content--horizontal">
            <div class="select-shell">
              <span class="select-shell__value"></span>
              <span class="select-shell__chevron"><svg><use href="#icon-chevron-down"/></svg></span>
              <select class="select-shell__select" id="paintStyle">
                <option value="simple">Simple</option>
                <hr>
                <option value="checkered">Checkered</option>
                <option value="horizontal">Horizontal stripes</option>
                <option value="vertical">Vertical stripes</option>
                <hr>
                <option value="ripple">Ripple</option>
                <option value="sunburst">Sunburst</option>
              </select>
            </div>
          </div>
        </div>

        <!-- SECONDARY PALETTE (non-simple paint styles only). Controls
             how "alternate" cells (checker / stripe / ripple / sunburst)
             pick their color. Lighten = derive from primary by lightening.
             A named palette = match the source pixel against that palette
             instead, giving the alternates an independent color identity. -->
        <div class="row" data-paint-style-only="checkered">
          <span class="row__label">Accent</span>
          <div class="row__content row__content--vertical">
            <div class="palette-picker palette-picker--modal" id="bgSecondaryPicker">
              <button type="button" class="palette-picker__display palette-picker__display--button" id="bgSecondaryButton" aria-haspopup="dialog" aria-expanded="false">
                <div class="palette-picker__swatches" id="bgSecondarySwatches"></div>
                <span class="palette-picker__chevron"><svg><use href="#icon-chevron-down"/></svg></span>
              </button>
              <div class="palette-modal" id="bgSecondaryModal" role="dialog" aria-label="Background accent palette rows" hidden></div>
            </div>
          </div>
        </div>

        <!-- CENTER ON SUBJECT (ripple / sunburst only) -->
        <div class="row" data-paint-style-only="centerable">
          <span class="row__label"></span>
          <div class="row__content row__content--vertical">
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input" id="bgCenterOnSubject">
              <span class="checkbox__icon">
                <svg class="checkbox__svg checkbox__svg--unchecked"><use href="#icon-checkbox-unchecked"/></svg>
                <svg class="checkbox__svg checkbox__svg--checked"><use href="#icon-checkbox-checked"/></svg>
              </span>
              <span>Centered on subject</span>
            </label>
          </div>
        </div>

        <!-- MAPPING -->
        <div class="row" data-palette-mode-only="preset">
          <span class="row__label">Mapping</span>
          <div class="row__content row__content--vertical">
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input" id="stretchL" checked>
              <span class="checkbox__icon">
                <svg class="checkbox__svg checkbox__svg--unchecked"><use href="#icon-checkbox-unchecked"/></svg>
                <svg class="checkbox__svg checkbox__svg--checked"><use href="#icon-checkbox-checked"/></svg>
              </span>
              <span>Lightness</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input" id="stretchC" checked>
              <span class="checkbox__icon">
                <svg class="checkbox__svg checkbox__svg--unchecked"><use href="#icon-checkbox-unchecked"/></svg>
                <svg class="checkbox__svg checkbox__svg--checked"><use href="#icon-checkbox-checked"/></svg>
              </span>
              <span>Chroma</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input" id="stretchH">
              <span class="checkbox__icon">
                <svg class="checkbox__svg checkbox__svg--unchecked"><use href="#icon-checkbox-unchecked"/></svg>
                <svg class="checkbox__svg checkbox__svg--checked"><use href="#icon-checkbox-checked"/></svg>
              </span>
              <span>Hue</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- GLYPHS (toggleable section) -->
    <div class="section" id="glyphsSection" data-style="binary" data-paint-style="simple">
      <input type="checkbox" class="section__toggle" id="glyphsToggle" checked>
      <label class="section__header" for="glyphsToggle">
        <span class="section__title">Symbols</span>
        <span class="section__indicator">
          <span class="section__indicator__thumb"></span>
        </span>
      </label>
      <div class="section__body">
        <!-- PALETTE -->
        <div class="row">
          <span class="row__label">Palette</span>
          <div class="row__content row__content--vertical">

                <div class="palette-picker__swatches" id="textPaletteSwatches"></div>
                <span class="palette-picker__chevron"><svg><use href="#icon-chevron-down"/></svg></span>
              </button>
              <div class="palette-modal" id="textPaletteModal" role="dialog" aria-label="Symbol palette rows" hidden></div>
            </div>
          </div>
        </div>

        <div class="row">

              <span class="segmented__indicator" aria-hidden="true"></span>
              <label class="segmented__option">
                <input type="radio" class="segmented__input" name="textBlankAreas" value="skip" checked>
                <span class="segmented__chip">Skip</span>
              </label>
              <label class="segmented__option">
                <input type="radio" class="segmented__input" name="textBlankAreas" value="fill">
                <span class="segmented__chip">Fill</span>

          </div>

                <option value="ripple">Ripple</option>

          <div class="row__content row__content--vertical">
            <div class="palette-picker palette-picker--modal" id="textSecondaryPicker">

                <div class="palette-picker__swatches" id="textSecondarySwatches"></div>

    // as foreground (looser cutoff); lower % = fewer (stricter).
    // 100 puts the cutoff at the saliency mean — everything above

    // the strongest saliency survives; 67 ≈ mean + 1 std, the
    // codebase's prior default. The percent is INVERTED in run()
    // before mapping to a std-dev multiplier so the consumer math
    // stays the same direction the original 0–3.0 slider used.
    const THRESHOLD_STOPS = (() => {
      const arr = [];
      for (let v = 0; v <= 100; v += 1) arr.push(v);
      return arr;
    })();

    // Cell-size scale stops: 1.0 to 5.0 in 0.1 increments. Slider range only;
    // the number input accepts any value above 1.
    const SCALE_STOPS = (() => {
      const arr = [];
      for (let v = 1.0; v <= 5.01; v += 0.1) arr.push(Math.round(v * 10) / 10);
      return arr;
    })();

    // Checker lift stops, in percent: 0 = no change, 100 = blend fully to
    // white. Integer steps for whole-number percentage display. Divided by
    // 100 at paint time before passing to lightenHex.
    const CHECKER_STOPS = (() => {
      const arr = [];
      for (let v = 0; v <= 100; v += 1) arr.push(v);
      return arr;
    })();

    // Edge falloff stops, in percent: 0 = no dampening (full saliency at
    // borders), 100 = full Hann window across the whole frame (most
    // suppression). The slider controls how WIDE the dampened band is, as
    // a fraction of frame width — see computeSaliency for the curve.
    const EDGE_FALLOFF_STOPS = (() => {
      const arr = [];
      for (let v = 0; v <= 100; v += 1) arr.push(v);
      return arr;
    })();

    // Contour sensitivity stops, in percent: 0 = highest threshold
    // (only large source-pixel jumps survive), 100 = lowest threshold
    // (every subtle transition produces a contour edge). The slider
    // value is mapped to an OKLab distance in run() and squared
    // before the per-edge comparison.
    const SENSITIVITY_STOPS = (() => {
      const arr = [];
      for (let v = 0; v <= 100; v += 1) arr.push(v);
      return arr;
    })();

    function oklabToHex(L, a, b) {
      const l_ = L + 0.3963377774*a + 0.2158037573*b;
      const m_ = L - 0.1055613458*a - 0.0638541728*b;
      const s_ = L - 0.0894841775*a - 1.2914855480*b;
      const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
      const lr =  4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
      const lg = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
      const lb = -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
      const toSrgb = c => {
        c = Math.max(0, Math.min(1, c));
        c = c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c, 1/2.4) - 0.055;
        return Math.round(c * 255).toString(16).padStart(2, '0');
      };
      return '#' + toSrgb(lr) + toSrgb(lg) + toSrgb(lb);
    }

    function srgbToOklab(r, g, b) {
      const lin = c => {
        c /= 255;
        return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
      };
      const lr = lin(r), lg = lin(g), lb = lin(b);
      const l = 0.4122214708*lr + 0.5363325363*lg + 0.0514459929*lb;
      const m = 0.2119034982*lr + 0.6806995451*lg + 0.1073969566*lb;
      const s = 0.0883024619*lr + 0.2817188376*lg + 0.6299787005*lb;
      const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
      return [
        0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_,
        1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_,
        0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_
      ];
    }

    function lchToLab(L, C, H) {
      const hRad = H * Math.PI / 180;
      return { L, a: C * Math.cos(hRad), b: C * Math.sin(hRad) };
    }

    // OKLCH-interpolated hex at fraction t between two endpoint hexes.
    // Linear lerp on L and C, shortest-arc lerp on H so hues like blue→red
    // don't sweep all the way around the wheel. Used by the Border
    // Gradient color mode (vertical only — one color per row).
    function gradientHex(hexA, hexB, t) {
      const parse = h => {
        const s = h.replace(/^#/, '');
        return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
      };
      const [rA, gA, bA] = parse(hexA);
      const [rB, gB, bB] = parse(hexB);
      const [LA, aA_, bA_] = srgbToOklab(rA, gA, bA);
      const [LB, aB_, bB_] = srgbToOklab(rB, gB, bB);
      const CA = Math.sqrt(aA_*aA_ + bA_*bA_);
      const CB = Math.sqrt(aB_*aB_ + bB_*bB_);
      const HA = Math.atan2(bA_, aA_);
      const HB = Math.atan2(bB_, aB_);
      let dH = HB - HA;
      if (dH >  Math.PI) dH -= 2 * Math.PI;
      if (dH < -Math.PI) dH += 2 * Math.PI;
      const L = LA + (LB - LA) * t;
      const C = CA + (CB - CA) * t;
      const H = HA + dH * t;
      return oklabToHex(L, C * Math.cos(H), C * Math.sin(H));
    }

    const PALETTE = PALETTE_OKLCH.map(([L, C, H]) => {
      const { a, b } = lchToLab(L, C, H);
      return { L, a, b, hex: oklabToHex(L, a, b) };
    });

    const TEXT_PALETTE = TEXT_PALETTE_OKLCH.map(([L, C, H]) => {
      const { a, b } = lchToLab(L, C, H);
      return { L, a, b, hex: oklabToHex(L, a, b) };
    });

    // Vibrant — high-chroma, edge-of-gamut palette. Designed as a
    // third named option alongside Pastel (bg defaults) and Mid tone
    // (glyph defaults). L values are already in 0-1 form (percentages
    // from the spec divided by 100).
    const VIBRANT_PALETTE_OKLCH = [
      [0.4268, 0.175, 29.23],
      [0.6261, 0.257, 29.23],
      [0.7708, 0.173, 64.75],
      [0.9680, 0.211, 109.76],
      [0.8665, 0.295, 142.49],
      [0.9054, 0.154, 194.77],
      [0.6294, 0.161, 260.38],
      [0.4507, 0.312, 264.05],
      [0.5609, 0.296, 302.22],
      [0.7011, 0.322, 328.58],
    ];
    const VIBRANT_PALETTE = VIBRANT_PALETTE_OKLCH.map(([L, C, H]) => {
      const { a, b } = lchToLab(L, C, H);
      return { L, a, b, hex: oklabToHex(L, a, b) };
    });

    // Dark — the Google Sheets "Dark X 3" row (the darkest tier).
    // Single-row palette so it slots in next to Vibrant rather than
    // mirroring Pastel/Mid tone's 3-tier structure. Computed from the
    // canonical Sheets hexes #5B0F00, #660000, etc.
    const DARK_PALETTE_OKLCH = [
      [0.308, 0.111, 33.9],
      [0.320, 0.131, 29.2],
      [0.431, 0.101, 57.6],
      [0.507, 0.104, 86.5],
      [0.381, 0.098, 136.9],
      [0.302, 0.046, 215.9],
      [0.400, 0.120, 259.6],
      [0.333, 0.091, 251.6],
      [0.244, 0.102, 287.1],
      [0.291, 0.094, 352.3],
    ];
    const DARK_PALETTE = DARK_PALETTE_OKLCH.map(([L, C, H]) => {
      const { a, b } = lchToLab(L, C, H);
      return { L, a, b, hex: oklabToHex(L, a, b) };
    });

    // Standard — Google's brand accent set, drawn from the "Standard"
    // row in Sheets minus the two endpoints (black and white). Six
    // recognizable Material colors covering the warm-to-cool spectrum;
    // black/white live in the Black and white palette instead so each
    // palette stays tonally coherent.
    const STANDARD_PALETTE_OKLCH = [
      [0.630, 0.180, 260.0],  // #4285F4
      [0.626, 0.206,  29.1],  // #EA4335
      [0.830, 0.170,  84.0],  // #FBBC04
      [0.648, 0.160, 148.5],  // #34A853
      [0.705, 0.199,  45.7],  // #FF6D01
      [0.736, 0.105, 202.3],  // #46BDC6
    ];
    const STANDARD_PALETTE = STANDARD_PALETTE_OKLCH.map(([L, C, H]) => {
      const { a, b } = lchToLab(L, C, H);
      return { L, a, b, hex: oklabToHex(L, a, b) };
    });

    // Black and white — 10-stop grayscale ramp from Sheets' standard
    // gray row. Chroma is zero throughout, so OKLCH hue is meaningless
    // (kept at 89.9 only because that's what srgbToOklab returns for
    // grayscale). Nearest-match against this palette becomes a pure
    // luminance match — useful for high-contrast / mono renders.
    const BW_PALETTE_OKLCH = [
      [0.000, 0.000,  0.0],  // #000000
      [0.383, 0.000, 89.9],  // #434343
      [0.510, 0.000, 89.9],  // #666666
      [0.683, 0.000, 89.9],  // #999999
      [0.779, 0.000, 89.9],  // #B7B7B7
      [0.845, 0.000, 89.9],  // #CCCCCC
      [0.885, 0.000, 89.9],  // #D9D9D9
      [0.952, 0.000, 89.9],  // #EFEFEF
      [0.964, 0.000, 89.9],  // #F3F3F3
      [1.000, 0.000, 89.9],  // #FFFFFF
    ];
    const BW_PALETTE = BW_PALETTE_OKLCH.map(([L, C, H]) => {
      const { a, b } = lchToLab(L, C, H);
      return { L, a, b, hex: oklabToHex(L, a, b) };
    });

    // Named-palette registry. Every picker (bg, glyphs, border) looks
    // up palettes through this map so the same names mean the same
    // colors everywhere. Pastel and Mid tone are aliases for the
    // existing bg / glyph defaults — same data, surfaced as cross-
    // section options.
    const PALETTES_BY_NAME = {
      pastel:   PALETTE,
      midtone:  TEXT_PALETTE,
      vibrant:  VIBRANT_PALETTE,
      dark:     DARK_PALETTE,
      standard: STANDARD_PALETTE,
      bw:       BW_PALETTE,
    };

    // Helper: turn a list of hex strings into the {L, a, b, hex} shape
    // every palette consumer expects. Hex → sRGB → OKLab, with the hex
    // normalized to uppercase for stable swatch identity.
    function paletteFromHexes(hexes) {
      return hexes.map(hex => {
        const h = hex.replace(/^#/, '');
        const r = parseInt(h.slice(0, 2), 16);
        const g = parseInt(h.slice(2, 4), 16);
        const b = parseInt(h.slice(4, 6), 16);
        const [L, oa, ob] = srgbToOklab(r, g, b);
        return { L, a: oa, b: ob, hex: '#' + h.toUpperCase() };
      });
    }

    // Row catalog for the bg-palette modal. Eight rows of ten colors
    // each, drawn from the Google Sheets standard color palette: one
    // grayscale ramp, one saturated row, then six lightness variants
    // (Light 3 → Dark 2) per color column. The active bg palette is
    // the union of all checked rows, concatenated in the order below.
    const BG_PALETTE_ROWS = [
      { id: 'gray',    label: 'Grayscale', colors: paletteFromHexes([
        '#000000', '#434343', '#666666', '#999999', '#B7B7B7',
        '#CCCCCC', '#D9D9D9', '#EFEFEF', '#F3F3F3', '#FFFFFF',
      ])},
      { id: 'sat',     label: 'Saturated', colors: paletteFromHexes([
        '#980000', '#FF0000', '#FF9900', '#FFFF00', '#00FF00',
        '#00FFFF', '#4A86E8', '#0000FF', '#9900FF', '#FF00FF',
      ])},
      { id: 'light3',  label: 'Light 3',   colors: paletteFromHexes([
        '#E6B8AF', '#F4CCCC', '#FCE5CD', '#FFF2CC', '#D9EAD3',
        '#D0E0E3', '#C9DAF8', '#CFE2F3', '#D9D2E9', '#EAD1DC',
      ])},
      { id: 'light2',  label: 'Light 2',   colors: paletteFromHexes([
        '#DD7E6B', '#EA9999', '#F9CB9C', '#FFE599', '#B6D7A8',
        '#A2C4C9', '#A4C2F4', '#9FC5E8', '#B4A7D6', '#D5A6BD',
      ])},
      { id: 'light1',  label: 'Light 1',   colors: paletteFromHexes([
        '#CC4125', '#E06666', '#F6B26B', '#FFD966', '#93C47D',
        '#76A5AF', '#6D9EEB', '#6FA8DC', '#8E7CC3', '#C27BA0',
      ])},
      { id: 'default', label: 'Default',   colors: paletteFromHexes([
        '#A61C00', '#CC0000', '#E69138', '#F1C232', '#6AA84F',
        '#45818E', '#3C78D8', '#3D85C6', '#674EA7', '#A64D79',
      ])},
      { id: 'dark1',   label: 'Dark 1',    colors: paletteFromHexes([
        '#85200C', '#990000', '#B45F06', '#BF9000', '#38761D',
        '#134F5C', '#1155CC', '#0B5394', '#351C75', '#741B47',
      ])},
      { id: 'dark2',   label: 'Dark 2',    colors: paletteFromHexes([
        '#5B0F00', '#660000', '#783F04', '#7F6000', '#274E13',
        '#0C343D', '#1C4587', '#073763', '#20124D', '#4C1130',
      ])},
    ];
    // Per-row selection state: Map<rowId, Set<colorIndex>>. A row whose
    // Set contains every index is "fully selected" (and the row checkbox
    // reads as checked); a row whose Set has 0 < size < length is
    // "mixed" (row checkbox indeterminate, individual swatches show
    // rings); a missing or empty Set means nothing in that row is in
    // the active palette. The active bg palette is the union of every
    // selected swatch, concatenated in row order then index order.
    const bgRowSelections     = new Map();
    const symbolRowSelections = new Map();
    const bgAccentRowSelections   = new Map();
    const textAccentRowSelections = new Map();
    const silhouetteRowSelections = new Map();
    const contourRowSelections    = new Map();
    // Defaults — each picker starts with one or more rows selected so
    // the section has a working palette out of the box. Choices:
    // bg keeps the pastel-leaning 3-row default; symbol defaults to
    // the saturated mid-tone row (Sheets' "Default" tier); accents
    // start with the vibrant row so they contrast against the pastel
    // bg; border defaults to a single swatch — pure blue from the
    // saturated row.
    (function seedPaletteDefaults() {
      // Bg: three "light" rows (the old Pastel option's three tiers).
      ['light3', 'light2', 'light1'].forEach(id => {
        const row = BG_PALETTE_ROWS.find(r => r.id === id);
        bgRowSelections.set(id, new Set(row.colors.map((_, i) => i)));
      });
      // Symbol: the saturated mid-tone row.
      const symbolDefault = BG_PALETTE_ROWS.find(r => r.id === 'default');
      symbolRowSelections.set('default', new Set(symbolDefault.colors.map((_, i) => i)));
      // Accents: vibrant.
      const accentDefault = BG_PALETTE_ROWS.find(r => r.id === 'sat');
      bgAccentRowSelections.set('sat',   new Set(accentDefault.colors.map((_, i) => i)));
      textAccentRowSelections.set('sat', new Set(accentDefault.colors.map((_, i) => i)));
      // Border layers: each starts with the single pure-blue
      // swatch in the saturated row. (#0000FF is index 7 in
      // 'sat'.) Silhouette and Contour share this default so the
      // out-of-box look is consistent across the two outline
      // passes; the chip previews show just this one swatch.
      silhouetteRowSelections.set('sat', new Set([7]));
      contourRowSelections.set('sat',    new Set([7]));
    })();

    // Returns the live palette as a flat array of { L, a, b, hex }
    // assembled from whatever swatches in `selectionMap` are currently
    // selected, in row order then index order. Empty selection returns
    // [] — callers fall back to a default. Used by every modal-style
    // picker (bg, symbol, bg accent, text accent, border) so they all
    // share one palette-assembly path; only their selection state and
    // fallback differ.
    function getActivePaletteForMap(selectionMap) {
      const out = [];
      for (const row of BG_PALETTE_ROWS) {
        const sel = selectionMap.get(row.id);
        if (!sel || !sel.size) continue;
        for (let i = 0; i < row.colors.length; i++) {
          if (sel.has(i)) out.push(row.colors[i]);
        }
      }
      return out;
    }

    // Bg-specific shorthand kept so existing call sites and the
    // representative-palette-name heuristic stay terse.
    function getActiveBgPalette() {
      return getActivePaletteForMap(bgRowSelections);
    }

    // Classify a row's selection state inside a given map.
    // 'full' = every swatch selected, 'mixed' = some but not all,
    // 'empty' = none. Used by the modal-picker wiring code below.
    function rowSelectionStateInMap(row, selectionMap) {
      const sel = selectionMap.get(row.id);
      if (!sel || !sel.size) return 'empty';
      if (sel.size === row.colors.length) return 'full';
      return 'mixed';
    }

    // Resolves which palette is active right now for a given picker.
    /* Computes a palette's L / C / H extents in OKLCH — the output range
       the Mapping stretch remaps pixels into. Each palette (primary or
       accent) gets its own gamut so a stretched pixel fills that
       palette's range rather than borrowing another's. Hue is a plain
       atan2 min/max, which is fine here since the built-in palettes don't
       straddle the ±π wrap; a custom palette that did would just get a
       wider H range. */
    function paletteGamut(palette) {
      let minL = Infinity, maxL = -Infinity;
      let minC = Infinity, maxC = -Infinity;
      let minH = Infinity, maxH = -Infinity;
      for (const p of palette) {
        const C = Math.sqrt(p.a*p.a + p.b*p.b);
        const H = Math.atan2(p.b, p.a);
        if (p.L < minL) minL = p.L;  if (p.L > maxL) maxL = p.L;
        if (C < minC) minC = C;      if (C > maxC) maxC = C;
        if (H < minH) minH = H;      if (H > maxH) maxH = H;
      }
      return { minL, maxL, minC, maxC, minH, maxH };
    }

    /* ============================================================
       SHEET COLUMN HELPERS
       ============================================================ */
    function colToLetters(n) {
      if (n < 1) return 'A';
      let s = '';
      while (n > 0) {
        const r = (n - 1) % 26;
        s = String.fromCharCode(65 + r) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    }

    function lettersToCol(s) {
      if (!s) return 0;
      let n = 0;
      for (const ch of s.toUpperCase()) {
        if (ch < 'A' || ch > 'Z') return 0;
        n = n * 26 + (ch.charCodeAt(0) - 64);
      }
      return n;
    }

    function parseColumnInput(s) {
      if (!s) return 0;
      const v = s.toString().toUpperCase().trim();
      if (/^\d+$/.test(v)) return parseInt(v, 10);
      if (/^[A-Z]+$/.test(v)) return lettersToCol(v);
      return 0;
    }

    /* ============================================================
       FILENAME (middle truncation)
       ============================================================ */
    const TAIL_CHARS = 10;

    function setUploadFilename(name) {
      const label = $('uploadLabel');
      label.innerHTML = '';
      if (!name) {
        label.textContent = 'Upload image';
        return;
      }
      if (name.length <= TAIL_CHARS + 3) {
        label.textContent = name;
        return;
      }
      const head = name.slice(0, name.length - TAIL_CHARS);
      const tail = name.slice(-TAIL_CHARS);
      const headEl = document.createElement('span');
      headEl.className = 'filename__start';
      headEl.textContent = head;
      const tailEl = document.createElement('span');
      tailEl.className = 'filename__end';
      tailEl.textContent = tail;
      label.appendChild(headEl);
      label.appendChild(tailEl);
    }

    /* ============================================================
       STEP SLIDER
       ============================================================ */
    class StepSlider {
      constructor(container, stops, onChange, options) {
        options = options || {};
        this.container = container;
        this.stops = stops;
        this.onChange = onChange;
        this.value = stops[0];
        this.dragging = false;
        this.pointerId = null;

        // Optional snap point: a value the slider lightly snaps to when
        // dragged near it. `snapTolerance` is in stops (not pixels), so for
        // an integer-stop slider, 2 means "within ±2 stops".
        this.snap = options.snap;
        this.snapTolerance = options.snapTolerance != null ? options.snapTolerance : 2;
        this.snapIndex = -1;
        let markerHtml = '';
        if (this.snap != null) {
          // Find the stop index closest to the snap value.
          let best = 0, bestDist = Infinity;
          for (let i = 0; i < stops.length; i++) {
            const d = Math.abs(stops[i] - this.snap);
            if (d < bestDist) { best = i; bestDist = d; }
          }
          this.snapIndex = best;
