          const snapPos = (this.snapIndex / (this.stops.length - 1)) * 100;
          markerHtml = '<div class="slider__snap-marker" style="left: ' + snapPos + '%"></div>';
        }

        container.innerHTML =
          '<div class="slider__track">' +
            '<div class="slider__fill"></div>' +
            markerHtml +
            '<div class="slider__thumb"></div>' +
          '</div>';
        this.track = container.querySelector('.slider__track');
        this.fill = container.querySelector('.slider__fill');
        this.thumb = container.querySelector('.slider__thumb');

        container.addEventListener('pointerdown', this._onDown.bind(this));
        container.addEventListener('pointermove', this._onMove.bind(this));
        container.addEventListener('pointerup', this._onUp.bind(this));
        container.addEventListener('pointercancel', this._onUp.bind(this));
      }

      setValue(val, fireChange) {
        this.value = val;
        const pos = this._positionFromValue(val);
        // Thumb's `left` names its left edge (no transform centering).
        // Range: 2px at pos=0 (track inset) → trackWidth − 8px at
        // pos=1 (inset + thumb width = 2 + 6 = 8). Expressed as a
        // calc so the gradient between extremes interpolates within
        // the track's content area.
        // Net: left = pos · 100% + (2 − 10 · pos) px
        // where 10 = 2·INSET + THUMB_WIDTH. Mirrored from CSS — keep
        // in sync if either changes.
        const offsetPx = 2 - 10 * pos;
        this.thumb.style.left = `calc(${pos * 100}% + ${offsetPx}px)`;
        this.fill.style.width = (pos * 100) + '%';
        if (fireChange && this.onChange) this.onChange(val);
      }

      _positionFromValue(val) {
        const stops = this.stops;
        if (val <= stops[0]) return 0;
        if (val >= stops[stops.length - 1]) return 1;
        for (let i = 0; i < stops.length - 1; i++) {
          if (val >= stops[i] && val <= stops[i + 1]) {
            const t = (val - stops[i]) / (stops[i + 1] - stops[i]);
            return (i + t) / (stops.length - 1);
          }
        }
        return 0;
      }

      _indexFromClientX(clientX) {
        const rect = this.track.getBoundingClientRect();
        const ratio = (clientX - rect.left) / rect.width;
        const clamped = Math.max(0, Math.min(1, ratio));
        const idx = Math.round(clamped * (this.stops.length - 1));
        // Light snap: if the cursor lands within tolerance of the snap point,
        // jump to it. Drags outside the tolerance proceed normally.
        if (this.snapIndex >= 0 && Math.abs(idx - this.snapIndex) <= this.snapTolerance) {
          return this.snapIndex;
        }
        return idx;
      }

      _onDown(e) {
        e.preventDefault();
        this.dragging = true;
        this.pointerId = e.pointerId;
        try { this.container.setPointerCapture(e.pointerId); } catch (_) {}
        this.setValue(this.stops[this._indexFromClientX(e.clientX)], true);
      }

      _onMove(e) {
        if (!this.dragging || e.pointerId !== this.pointerId) return;
        this.setValue(this.stops[this._indexFromClientX(e.clientX)], true);
      }

      _onUp(e) {
        if (!this.dragging || e.pointerId !== this.pointerId) return;
        this.dragging = false;
        try { this.container.releasePointerCapture(e.pointerId); } catch (_) {}
        this.pointerId = null;
      }
    }

    /* ============================================================
       UI WIRING
       ============================================================ */
    const $ = id => document.getElementById(id);

    // Status chip: shows a small icon + message floating above the paint
    // bar. Three types, each with its own icon:
    //   info    — informational message, auto-clears after 4s
    //   pending — work in progress, sticks around until replaced (no
    //             auto-clear). Icon is a spinner that rotates.
    //   error   — error message, auto-clears after 4s
    // Calling setStatus('') clears the chip immediately. Each call
    // cancels any pending timer so a stale "Done" can't wipe a fresh
    // "Painting".
    let statusTimer = null;
    const STATUS_ICON_IDS = {
      info: 'icon-status-info',
      pending: 'icon-status-spinner',
      error: 'icon-status-error',
    };
    const STATUS_ANIM = {
      duration: 320,
      easing: 'cubic-bezier(0.34, 1.8, 0.64, 1)',
    };
    const STATUS_KEYFRAMES = [
      { opacity: 0, transform: 'translate(-50%, 10px)' },
      { opacity: 1, transform: 'translate(-50%, 0)' },
    ];
    const setStatus = (msg, type) => {
      const el = $('status');
      clearTimeout(statusTimer);
      statusTimer = null;
      // Clearing the chip: run the entrance keyframes in reverse so the
      // exit mirrors the entrance — the chip dips up slightly
      // (anticipation), then falls and fades. innerHTML is only cleared
      // once the exit animation finishes; cancellation (e.g. a new
      // setStatus arrives mid-exit) skips the clear so the new content
      // can take over without a flicker.
      if (!msg) {
        if (!el.innerHTML) return;
        el.getAnimations().forEach(a => a.cancel());
        const exit = el.animate(STATUS_KEYFRAMES, {
          ...STATUS_ANIM,
          direction: 'reverse',
        });
        exit.onfinish = () => { el.innerHTML = ''; };
        return;
      }
      const kind = STATUS_ICON_IDS[type] ? type : 'info';
      const iconId = STATUS_ICON_IDS[kind];
      // Build DOM safely: icon via innerHTML (controlled markup), text
      // via textContent (user/error-string content).
      el.innerHTML =
        `<span class="status__icon status__icon--${kind}">` +
        `<svg><use href="#${iconId}"/></svg></span>` +
        `<span class="status__text"></span>`;
      el.querySelector('.status__text').textContent = msg;
      // Entrance: fade in while bouncing up with overshoot. Cancel any
      // in-flight animation so rapid status changes don't stack.
      el.getAnimations().forEach(a => a.cancel());
      el.animate(STATUS_KEYFRAMES, STATUS_ANIM);
      if (kind !== 'pending') {
        statusTimer = setTimeout(() => { setStatus(''); }, 4000);
      }
    };

    let sizeSlider, thresholdSlider;

    function init() {
      wireSizeControls();
      wireThresholdControls();
      wireEdgeFalloffControls();
      wireSensitivityControls();
      wireCellScaleControls();
      wirePositionControls();
      wireImageControls();
      wireInputAutoselect();
      wireSelectFocusModality();
      wireSelectShells();
      wireSegmentedControls();
      wireGlyphStyle();
      wirePaintStyle();
      wireTextPaintStyle();
      wireBgPaletteModal();
      wirePaletteModal('textPalettePicker',   'textPaletteButton',   'textPaletteModal',   'textPaletteSwatches',   symbolRowSelections);
      wirePaletteModal('bgSecondaryPicker',   'bgSecondaryButton',   'bgSecondaryModal',   'bgSecondarySwatches',   bgAccentRowSelections);
      wirePaletteModal('textSecondaryPicker', 'textSecondaryButton', 'textSecondaryModal', 'textSecondarySwatches', textAccentRowSelections);
      wireSilhouettePaletteModal();
      wireContourPaletteModal();
      wireBorderStylePicker('silhouetteStyle', 'silhouetteStylePreview');
      wireBorderStylePicker('contourStyle',    'contourStylePreview');
      wireSectionOverflow();
    }

    // Flip section body's overflow to visible AFTER the expand transition
    // completes, so children's hover/focus outlines can paint past the
    // body's edges without getting clipped. Goes back to hidden the
    // instant a collapse starts so content gets clipped during the
    // shrink animation. Without this, every first/last row of a section
    // and every right-edge input has its outline cut off where the body
    // boundary sits.
    function wireSectionOverflow() {
      document.querySelectorAll('.section__toggle').forEach(toggle => {
        const section = toggle.closest('.section');
        if (!section) return;
        const body = section.querySelector('.section__body');
        if (!body) return;
        const applyOpen = () => { body.style.overflow = 'visible'; };
        const applyClosed = () => { body.style.overflow = ''; };
        // If already expanded at page load, set visible immediately —
        // no transition to wait for.
        if (toggle.checked) applyOpen();
        toggle.addEventListener('change', () => {
          if (toggle.checked) {
            // Expanding: keep overflow hidden during animation, flip to
            // visible at the end. transitionend fires for each animated
            // property; gate on height so we only flip once.
            const onEnd = e => {
              if (e.propertyName !== 'height') return;
              body.removeEventListener('transitionend', onEnd);
              if (toggle.checked) applyOpen();
            };
            body.addEventListener('transitionend', onEnd);
          } else {
            // Collapsing: clip immediately so content doesn't overflow
            // as height shrinks toward zero.
            applyClosed();
          }
        });
      });
    }

    // Palette picker: when "Custom" is chosen, the picker chip swaps the
    // swatch preview for a "CUSTOM" label and the hex-list input slides
    // in below. Switching back to "Default" hides the input but keeps
    // its value, so toggling between modes doesn't lose what was typed.
    /* ------------------------------------------------------------
       Generic palette modal — used by bg, symbol, bg accent, text
       accent, and border pickers. Each call site supplies its own
       element IDs and a Map<rowId, Set<colorIndex>> selection state;
       the same DOM + behavior code drives them all.

       The picker's chip is a real <button>. Click it to open the
       modal directly below (position:fixed, anchored from the
       button's getBoundingClientRect). Inside the modal, each row
       has:
         - A row checkbox with three states (unchecked / checked /
           indeterminate) reflecting how many swatches in that row
           are currently selected in this picker's selectionMap.
         - Ten swatch buttons. Clicking a swatch toggles just that
           color in this picker's map. When a row is partially
           selected ("mixed"), every selected swatch in that row
           shows a 2px primary-colored outline ring with a 1px gap;
           when the row goes fully selected, the rings drop off —
           the row checkbox alone conveys the state.

       Clicking the row checkbox:
         - From unchecked → selects every swatch in that row.
         - From mixed → selects every swatch.
         - From checked → clears every swatch in that row.

       Click-outside-to-close uses a document-level pointerdown
       listener installed only while the modal is open. Scroll /
       resize also close (fixed positioning detaches the modal
       from the button otherwise).

       `onChange`, if provided, fires after every state mutation —
       sections that depend on the picker's state can hook in there.
       `openAbove`, if truthy, anchors the modal above the button
       instead of below (used by the border picker which sits near
       the bottom of the sidebar).
       ------------------------------------------------------------ */
    /* ------------------------------------------------------------
       Shared modal scrim — a single transparent full-viewport
       element that sits behind every open palette modal and in
       front of everything else. Catches the click that closes the
       modal and absorbs it so the click can't reach toggles or
       other UI beneath. Only one modal can be open at a time, so
       one scrim is enough; we just point its handler at whichever
       modal's close() is currently active.
       ------------------------------------------------------------ */
    let _modalScrim = null;
    let _modalScrimClose = null;
    function showModalScrim(closeFn) {
      if (!_modalScrim) {
        _modalScrim = document.createElement('div');
        _modalScrim.className = 'palette-modal-scrim';
        document.body.appendChild(_modalScrim);
        _modalScrim.addEventListener('click', () => {
          if (_modalScrimClose) _modalScrimClose();
        });
      }
      _modalScrimClose = closeFn;
      _modalScrim.hidden = false;
    }
    function hideModalScrim() {
      _modalScrimClose = null;
      if (_modalScrim) _modalScrim.hidden = true;
    }

    function wirePaletteModal(pickerId, buttonId, modalId, chipId, selectionMap, onChange, openAbove) {
      const picker = $(pickerId);
      const button = $(buttonId);
      const modal = $(modalId);
      const section = picker.closest('.section');

      const rowHandles = []; // [{ row, input, swatches: HTMLButtonElement[] }]

      // Initial palette mode on the picker. The section's
      // data-palette-mode (which the CSS gates against to hide
      // Mapping rows) is computed from ALL modal-pickers inside
      // the section, not just this one — a section that contains
      // both a primary and a secondary palette picker should keep
      // Mapping visible as long as at least one of them is still
      // in Preset mode, since Mapping's stretch applies to
      // whichever palette is preset.
      if (!picker.dataset.paletteMode) picker.dataset.paletteMode = 'preset';
      function syncSectionMode() {
        if (!section) return;
        const pickers = section.querySelectorAll('.palette-picker--modal');
        let anyPreset = false;
        for (const p of pickers) {
          if ((p.dataset.paletteMode || 'preset') === 'preset') {
            anyPreset = true;
            break;
          }
        }
        section.dataset.paletteMode = anyPreset ? 'preset' : 'spectrum';
      }
      syncSectionMode();

      function setMode(mode) {
        picker.dataset.paletteMode = mode;
        syncSectionMode();
        modal.dataset.paletteMode = mode;
        modal.style.setProperty('--tab-index', mode === 'spectrum' ? 1 : 0);
        // Update tab aria-selected so the active tab reads at full
        // opacity (per the CSS rule).
        const tabs = modal.querySelectorAll('.palette-modal__tab');
        for (const t of tabs) {
          t.setAttribute('aria-selected', t.dataset.mode === mode ? 'true' : 'false');
        }
        // Chip preview tracks the mode: discrete swatches in Preset,
        // hue gradient in Spectrum. Re-running refresh handles the
        // Preset case; Spectrum overrides the chip directly below.
        if (mode === 'spectrum' && chipId) {
          const chip = $(chipId);
          if (chip) {
            chip.innerHTML = '<span class="palette-chip__spectrum" aria-hidden="true"></span>';
          }
        } else {
          refresh();
        }
        if (onChange) onChange();
      }

      function buildRows() {
        modal.innerHTML = '';

        // Tab strip — Preset (default) and Spectrum, with a sliding
        // indicator that carries the concave corners via pseudo-
        // elements. --tab-index drives the indicator's translateX.
        const tabs = document.createElement('div');
        tabs.className = 'palette-modal__tabs';
        tabs.setAttribute('role', 'tablist');

        const indicator = document.createElement('span');
        indicator.className = 'palette-modal__tab-indicator';
        indicator.setAttribute('aria-hidden', 'true');
        tabs.appendChild(indicator);

        function makeTab(mode, label) {
          const t = document.createElement('button');
          t.type = 'button';
          t.className = 'palette-modal__tab';
          t.dataset.mode = mode;
          t.setAttribute('role', 'tab');
          t.textContent = label;
          t.addEventListener('click', () => setMode(mode));
          tabs.appendChild(t);
          return t;
        }
        makeTab('preset',   'Preset');
        makeTab('spectrum', 'Spectrum');
        modal.appendChild(tabs);

        // Preset body — the original row picker.
        const presetBody = document.createElement('div');
        presetBody.className = 'palette-modal__body palette-modal__body--preset';

        const frag = document.createDocumentFragment();
        for (const row of BG_PALETTE_ROWS) {
          const rowEl = document.createElement('div');
          rowEl.className = 'palette-modal__row';

          const label = document.createElement('label');
          label.className = 'checkbox';

          const input = document.createElement('input');
          input.type = 'checkbox';
          input.className = 'checkbox__input';
          input.addEventListener('change', () => {
            const state = rowSelectionStateInMap(row, selectionMap);
            // Clicking checked → clear. Anything else (empty or mixed)
            // → fill. Treating mixed as "advance toward full" matches
            // the conventional indeterminate→true→false cycle.
            if (state === 'full') {
              selectionMap.set(row.id, new Set());
            } else {
              selectionMap.set(row.id, new Set(row.colors.map((_, i) => i)));
            }
            refresh();
          });

          const icon = document.createElement('span');
          icon.className = 'checkbox__icon';
          icon.innerHTML =
            '<svg class="checkbox__svg checkbox__svg--unchecked"><use href="#icon-checkbox-unchecked"/></svg>' +
            '<svg class="checkbox__svg checkbox__svg--checked"><use href="#icon-checkbox-checked"/></svg>' +
            '<svg class="checkbox__svg checkbox__svg--mixed"><use href="#icon-checkbox-mixed"/></svg>';

          label.append(input, icon);

          const swatches = document.createElement('div');
          swatches.className = 'palette-modal__swatches';
          const swatchEls = [];
          for (let i = 0; i < row.colors.length; i++) {
            const p = row.colors[i];
            const sw = document.createElement('button');
            sw.type = 'button';
            sw.className = 'palette-modal__swatch';
            if (p.L >= LIGHT_SWATCH_THRESHOLD) sw.classList.add('palette-modal__swatch--light');
            sw.style.background = p.hex;
            sw.setAttribute('aria-label', p.hex);
            sw.addEventListener('click', () => {
              let sel = selectionMap.get(row.id);
              if (!sel) {
                sel = new Set();
                selectionMap.set(row.id, sel);
              }
              if (sel.has(i)) sel.delete(i);
              else sel.add(i);
              refresh();
            });
            swatches.appendChild(sw);
            swatchEls.push(sw);
          }

          rowEl.append(label, swatches);
          frag.appendChild(rowEl);
          rowHandles.push({ row, input, swatches: swatchEls });
        }
        presetBody.appendChild(frag);
        modal.appendChild(presetBody);

        // Spectrum body — explanatory text, single row tall. Renders
        // a meaningfully shorter modal so the mode change is visible
        // even before the user reads the copy.
        const spectrumBody = document.createElement('div');
        spectrumBody.className = 'palette-modal__body palette-modal__body--spectrum';
        const info = document.createElement('div');
        info.className = 'palette-modal__spectrum-info';
        info.textContent = 'Uses a full Spectrum color palette.';
        spectrumBody.appendChild(info);
        modal.appendChild(spectrumBody);

        // Apply the initial mode so the indicator and body visibility
        // settle before the modal first opens.
        setMode(picker.dataset.paletteMode || 'preset');
      }

      function refresh() {
        for (const { row, input, swatches } of rowHandles) {
          const state = rowSelectionStateInMap(row, selectionMap);
          input.checked = (state === 'full');
          input.indeterminate = (state === 'mixed');
          const sel = selectionMap.get(row.id);
          for (let i = 0; i < swatches.length; i++) {
            const ringed = (state === 'mixed') && sel && sel.has(i);
            swatches[i].classList.toggle('palette-modal__swatch--selected', ringed);
          }
        }
        if (chipId) renderPalettePreview(chipId, getActivePaletteForMap(selectionMap));
        if (onChange) onChange();
      }

      // Reposition the modal so it stays anchored to the button when
      // the sidebar scrolls or the window resizes. The modal is
      // position:fixed, so without this it would detach visually from
      // the button. Cheaper and less surprising than closing.
      function reposition() {
        const rect = button.getBoundingClientRect();
        if (openAbove) {
          modal.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
        } else {
          modal.style.top = (rect.bottom + 4) + 'px';
        }
      }
      function onViewportChange() { reposition(); }

      function open() {
        reposition();
        if (openAbove) {
          modal.style.top = '';
        } else {
          modal.style.bottom = '';
        }
        modal.hidden = false;
        picker.dataset.open = 'true';
        button.setAttribute('aria-expanded', 'true');
        // Scrim catches every click outside the modal and absorbs it,
        // closing the modal without letting the click reach any other
        // UI underneath (toggles, swatches in other rows, even the
        // picker's own button — to reopen, click again).
        showModalScrim(close);
        // Capture phase so scrolls on any ancestor scroll container
        // (including the sidebar's body) reach this handler; passive
        // because we only read layout, never preventDefault.
        window.addEventListener('scroll', onViewportChange, { capture: true, passive: true });
        window.addEventListener('resize', onViewportChange);
      }
      function close() {
        modal.hidden = true;
        picker.dataset.open = 'false';
        button.setAttribute('aria-expanded', 'false');
        hideModalScrim();
        window.removeEventListener('scroll', onViewportChange, { capture: true });
        window.removeEventListener('resize', onViewportChange);
      }

      button.addEventListener('click', () => {
        if (modal.hidden) open();
        else close();
      });

      buildRows();
      refresh();
    }

    // Bg picker — uses the bg-specific selection map declared at file
    // scope so getActiveBgPalette can read it without threading the map
    // through every caller. The section's data-palette-mode attribute
    // is managed by wirePaletteModal (synced to the Preset/Spectrum
    // tab choice), so no separate init is needed here.
    function wireBgPaletteModal() {
      wirePaletteModal('bgPalettePicker', 'bgPaletteButton', 'bgPaletteModal', 'bgPaletteSwatches', bgRowSelections);
    }

    // Border picker — same as bg/symbol/accent modals, but anchored
    // above its button instead of below (the picker sits near the
    // bottom of the sidebar so a downward modal would clip).
    function wireSilhouettePaletteModal() {
      wirePaletteModal('silhouettePalettePicker', 'silhouettePaletteButton', 'silhouettePaletteModal', 'silhouettePaletteSwatches', silhouetteRowSelections, null, true);
    }
    function wireContourPaletteModal() {
      wirePaletteModal('contourPalettePicker', 'contourPaletteButton', 'contourPaletteModal', 'contourPaletteSwatches', contourRowSelections, null, true);
    }

    // Render the drawn-line preview inside a Style chip. Each style
    // produces a different DOM shape — single line, double line, or
    // a flex row of segments. The popup itself shows plain text
    // labels because native <option> elements don't honor inner
    // HTML. Host id is passed in so the Silhouette and Contour
    // sections can share this renderer for their independent
    // previews.
    function renderBorderStylePreview(style, hostId) {
      const host = $(hostId);
      host.innerHTML = '';
      const makeLine = h => {
        const d = document.createElement('div');
        d.className = 'border-style-preview__line';
        d.style.height = h + 'px';
        return d;
      };
      const makeDots = (segWidth, gap) => {
        // repeating-linear-gradient tiles edge to edge regardless of the
        // chip's actual width, so the line reaches the right side cleanly.
        // The tile is (segWidth) of color followed by (gap) of transparent,
        // matching the visual spec of dashed=4/4 and dotted=2/2.
        const tile = segWidth + gap;
        const div = document.createElement('div');
        div.style.width = '100%';
        div.style.height = '2px';
        div.style.backgroundImage =
          `repeating-linear-gradient(to right, ` +
          `currentColor 0 ${segWidth}px, ` +
          `transparent ${segWidth}px ${tile}px)`;
        return div;
      };
      if (style === 'thin')          host.appendChild(makeLine(2));
      else if (style === 'medium')   host.appendChild(makeLine(4));
      else if (style === 'thick')    host.appendChild(makeLine(8));
      else if (style === 'dashed')   host.appendChild(makeDots(4, 4));
      else if (style === 'dotted')   host.appendChild(makeDots(2, 2));
      else if (style === 'double') {
        host.appendChild(makeLine(2));
        host.appendChild(makeLine(2));
      }
    }

    function wireBorderStylePicker(selectId, hostId) {
      const select = $(selectId);
      const apply = () => renderBorderStylePreview(select.value, hostId);
      select.addEventListener('change', apply);
      apply();
    }

    /* Background Paint Style dropdown. Mirrors wireGlyphStyle: updates the
       data-paint-style attribute on the Background section root; CSS hides
       checkered-only rows when style is simple. */
    function wirePaintStyle() {
      const select = $('paintStyle');
      const section = $('bgSection');
      const apply = () => { section.dataset.paintStyle = select.value; };
      select.addEventListener('change', apply);
      apply();
    }

    /* Same pattern as wirePaintStyle but on the Glyphs section, controlling
       the lift applied to text colors. Both sections use the same
       data-paint-style attribute name; the CSS rule that hides
       data-paint-style-only="checkered" rows applies inside each section
       scoped by ancestor, so the two are independent. */
    function wireTextPaintStyle() {
      const select = $('textPaintStyle');
      const section = $('glyphsSection');
      const apply = () => { section.dataset.paintStyle = select.value; };
      select.addEventListener('change', apply);
      apply();
    }

    /* Glyphs section style dropdown. Updates the data-style attribute on
       the section root; CSS handles row visibility based on the attribute.
       Values for hidden inputs are preserved in the DOM so switching back
       restores the user's prior settings. */
    function wireGlyphStyle() {
      const select = $('glyphStyle');
      const section = $('glyphsSection');
      const apply = () => { section.dataset.style = select.value; };
      select.addEventListener('change', apply);
      apply();
    }

    /* Wires every .segmented in the document. The shell's --seg-count CSS var
       is set from the number of options; --seg-index is updated on radio change
       so the CSS indicator slides into position. */
    function wireSegmentedControls() {
      document.querySelectorAll('.segmented').forEach(seg => {
        const inputs = seg.querySelectorAll('.segmented__input');
        seg.style.setProperty('--seg-count', inputs.length);
        const update = () => {
          inputs.forEach((input, i) => {
            if (input.checked) seg.style.setProperty('--seg-index', i);
          });
        };
        inputs.forEach(input => input.addEventListener('change', update));
        update();
      });
    }

    function renderPalettePreview(containerId, palette) {
      const container = $(containerId);
      container.innerHTML = '';
      const frag = document.createDocumentFragment();
      palette.forEach(p => {
        const swatch = document.createElement('div');
        swatch.className = 'palette-picker__swatch';
        if (p.L >= LIGHT_SWATCH_THRESHOLD) swatch.classList.add('palette-picker__swatch--light');
        swatch.style.background = p.hex;
        frag.appendChild(swatch);
      });
      container.appendChild(frag);
    }

    function wireSizeControls() {
      const input = $('sizeInput');
      sizeSlider = new StepSlider($('sizeSlider'), SIZE_STOPS, val => { input.value = val; });
      sizeSlider.setValue(parseInt(input.value, 10) || SIZE_STOPS[0], false);
      input.addEventListener('input', () => {
        const v = parseInt(input.value, 10);
        if (!isNaN(v)) sizeSlider.setValue(v, false);
      });
      // Clamp on blur to [1, 400]. Out-of-range or garbage values
      // settle to a valid integer; the cap protects the paint
      // pipeline from canvases big enough to risk hitting Apps
      // Script's 6-min execution ceiling. SIZE_STOPS tops at 400
      // too, so the slider and input agree at the max.
      input.addEventListener('blur', () => {
        let v = parseInt(input.value, 10);
        if (isNaN(v)) v = SIZE_STOPS[0];
        v = Math.max(1, Math.min(400, v));
        input.value = v;
        sizeSlider.setValue(v, false);
      });
    }

    // Generic wiring for sliders whose paired text input is a plain
    // "{n}%" string (no separate suffix element). Mirrors the slider
    // and input two ways: slider drag rewrites "{n}%" into the input;
    // typing into the input updates the slider; blur normalizes
    // whatever the user typed back to a clamped "{n}%" string. Used
    // by Threshold, Edge fade, and Contour sensitivity — all three
    // run on the same percent-domain stops array so they share the
    // [0, 100] clamp and the same blur-normalize contract. Returns
    // the StepSlider instance so callers can keep a handle on it.
    function wirePercentSlider(sliderId, inputId, stops, defaultValue) {
      const input = $(inputId);
      const slider = new StepSlider($(sliderId), stops, val => { input.value = val + '%'; });
      slider.setValue(parseInt(input.value, 10) || defaultValue, false);
      input.addEventListener('input', () => {
        const v = parseInt(input.value, 10);
        if (!isNaN(v)) slider.setValue(v, false);
      });
      input.addEventListener('blur', () => {
        const v = Math.max(0, Math.min(100, parseInt(input.value, 10) || defaultValue));
        input.value = v + '%';
        slider.setValue(v, false);
      });
      // Up/Down arrow nudging. Native number-input arrow handling
      // doesn't apply here because the field is text (carrying the
      // literal "X%" suffix). 1% per press, 10% with Shift — matches
      // the convention number inputs use. preventDefault stops the
      // browser from scrolling or moving the caret on these keys.
      input.addEventListener('keydown', e => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        const dir = e.key === 'ArrowUp' ? 1 : -1;
        const current = parseInt(input.value, 10);
        const base = isNaN(current) ? defaultValue : current;
        const v = Math.max(0, Math.min(100, base + dir * step));
        input.value = v + '%';
        slider.setValue(v, false);
      });
      return slider;
    }

    function wireThresholdControls() {
      thresholdSlider = wirePercentSlider('thresholdSlider', 'thresholdInput', THRESHOLD_STOPS, 67);
    }

    let edgeFalloffSlider;
    function wireEdgeFalloffControls() {
      edgeFalloffSlider = wirePercentSlider('edgeFalloffSlider', 'edgeFalloffInput', EDGE_FALLOFF_STOPS, 10);
    }

    let sensitivitySlider;
    function wireSensitivityControls() {
      sensitivitySlider = wirePercentSlider('sensitivitySlider', 'sensitivityInput', SENSITIVITY_STOPS, 50);
    }

    let cellScaleSlider;
    function wireCellScaleControls() {
      const input = $('cellScaleInput');
      cellScaleSlider = new StepSlider($('cellScaleSlider'), SCALE_STOPS, val => { input.value = val.toFixed(1); });
      cellScaleSlider.setValue(parseFloat(input.value) || 1.5, false);
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        if (!isNaN(v)) cellScaleSlider.setValue(v, false);
      });
    }

    function wirePositionControls() {
      const x = $('posX');

      x.addEventListener('input', () => {
        x.value = x.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      });

      const normalize = () => {
        const v = x.value.trim();
        if (!v) { x.value = 'A'; return; }
        if (/^\d+$/.test(v)) {
          x.value = colToLetters(Math.max(1, parseInt(v, 10)));
        } else if (/^[A-Z]+$/.test(v)) {
          x.value = v;
        } else {
          x.value = 'A';
        }
      };

      x.addEventListener('blur', normalize);

      x.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          normalize();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          x.value = colToLetters((parseColumnInput(x.value) || 0) + 1);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          x.value = colToLetters(Math.max(1, (parseColumnInput(x.value) || 2) - 1));
        }
      });

      // Position mode picker: Selection (default) follows the user's
      // active spreadsheet selection; Coordinates uses the X/Y inputs
      // above. The CSS gates the X/Y row on data-position-mode.
      const row = $('positionRow');
      document.querySelectorAll('input[name="positionMode"]').forEach(radio => {
        radio.addEventListener('change', () => {
          if (radio.checked) row.dataset.positionMode = radio.value;
        });
      });
    }

    function wireImageControls() {
      $('uploadBtn').addEventListener('click', () => $('fileInput').click());

      $('fileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadFilename(file.name);
        $('urlInput').value = '';
      });

      $('urlInput').addEventListener('input', () => {
        if ($('urlInput').value.trim()) {
          $('fileInput').value = '';
          setUploadFilename(null);
        }
      });
    }

    function wireInputAutoselect() {
      document.querySelectorAll('input[type="text"], input[type="number"]').forEach(el => {
        // Skip glyph inputs — selecting all the time interferes with single-char editing
        if (el.classList.contains('glyph-input')) return;
        el.addEventListener('focus', function () {
          setTimeout(() => this.select(), 0);
        });
      });
    }

    /* Keyboard-only focus rings for the overlaid <select> elements
       (.select-shell__select and .palette-picker__select). Chromium
       reports <select> elements as :focus-visible even after a mouse
       click, so the CSS :focus-visible heuristic can't suppress the
       post-click ring. We track the input modality ourselves: a keydown that moves focus
       (Tab / arrows) marks the next focus as keyboard-driven; any
       pointerdown marks it as pointer-driven. On focusin we tag the
       select with .kbd-focus only in the keyboard case, and the outline
       CSS keys off that class. focusout clears it. Listeners are capture-
       phase so the modality flag is set before focusin dispatches. */
    function wireSelectFocusModality() {
      let keyboard = false;
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Tab' || (e.key && e.key.indexOf('Arrow') === 0)) keyboard = true;
      }, true);
      document.addEventListener('pointerdown', function () {
        keyboard = false;
      }, true);
      document.addEventListener('focusin', function (e) {
        const el = e.target;
        if (el && el.matches && el.matches('.select-shell__select, .palette-picker__select')) {
          el.classList.toggle('kbd-focus', keyboard);
        }
      });
      document.addEventListener('focusout', function (e) {
        if (e.target && e.target.classList) e.target.classList.remove('kbd-focus');
      });
    }

    /* Mirrors each plain select's chosen option label into its visible
       .select-shell__value chip — on load and on every change. The real
       <select> is invisible (see .select-shell CSS), so without this the
       chip would be empty. Reads selectedIndex directly, so it composes
       with the selects' existing change handlers (wirePaintStyle etc.)
       rather than replacing them. */
    function wireSelectShells() {
      document.querySelectorAll('.select-shell__select').forEach(function (sel) {
        const value = sel.parentElement.querySelector('.select-shell__value');
        if (!value) return;
        const sync = function () {
          const opt = sel.options[sel.selectedIndex];
          value.textContent = opt ? opt.textContent : '';
        };
        sync();
        sel.addEventListener('change', sync);
      });
    }

    /* ============================================================
       MATCHING
       ============================================================ */
    function nearest(palette, L, a, b) {
      let best = palette[0];
      let bestDist = Infinity;
      for (const p of palette) {
        const dL = L - p.L, da = a - p.a, db = b - p.b;
        const d = dL*dL + da*da + db*db;
        if (d < bestDist) { bestDist = d; best = p; }
      }
      return best;
    }

    /* Blends a hex color toward white by `amount` (0..1) in sRGB space.
       Each channel moves `amount` of its remaining distance to 255. Used
       by the Checkered and Sunburst paint styles. sRGB blending is not
       perceptually uniform across colors but is simple and visually
       pleasing for a subtle texture effect. Amount is clamped to [0, 1]
       defensively so callers can pass scaled values without worrying
       about overshoot. */
    function lightenHex(hex, amount) {
      amount = Math.max(0, Math.min(1, amount));
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const nr = Math.round(r + (255 - r) * amount);
      const ng = Math.round(g + (255 - g) * amount);
      const nb = Math.round(b + (255 - b) * amount);
      return '#' + [nr, ng, nb].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    /* Returns a 3-phase ripple index (0, 1, or 2) for a cell at (x, y),
       centered on (cx, cy). Combines polar coordinates: each unit of radius
       advances the phase by 1, and each full revolution advances by
       RIPPLE_TWIST. The mix produces concentric bands with a mild
       rotational twist. Pure math, safe to call per-cell. */
    function ripplePhase(x, y, cx, cy) {
      const RIPPLE_TWIST = 2;
      const dx = x - cx;
      const dy = y - cy;
      const angle = Math.atan2(dy, dx); // radians, -PI..PI
      const radius = Math.sqrt(dx * dx + dy * dy);
      const t = (angle / (Math.PI * 2)) * RIPPLE_TWIST + radius;
      return ((Math.floor(t) % 3) + 3) % 3;
    }

    /* Returns a 2-phase sunburst index (0 or 1) for a cell at (x, y),
       centered on (cx, cy). The disk is split into SUNBURST_ARMS angular
       wedges, and each wedge twists by a log(radius) amount so the arms
       curve into a logarithmic curve. SUNBURST_TWIST controls how
       aggressively the arms curl — higher = tighter curl. */
    function sunburstPhase(x, y, cx, cy) {
      const SUNBURST_ARMS = 12;
      const SUNBURST_TWIST = 1.5;
      const dx = x - cx;
      const dy = y - cy;
      const angle = Math.atan2(dy, dx);
      const radius = Math.sqrt(dx * dx + dy * dy);
      const twistedAngle = angle - SUNBURST_TWIST * Math.log(radius + 1);
      const sector = Math.floor(twistedAngle * SUNBURST_ARMS / (Math.PI * 2));
      return ((sector % 2) + 2) % 2;
    }

    /* ============================================================
       FFT (radix-2 Cooley–Tukey, in-place)
       ============================================================ */
    function nextPow2(n) {
      let p = 1;
      while (p < n) p *= 2;
      return p;
    }

    function fft1d(re, im, n, inverse) {
      for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
          let t = re[i]; re[i] = re[j]; re[j] = t;
          t = im[i]; im[i] = im[j]; im[j] = t;
        }
      }
      for (let len = 2; len <= n; len <<= 1) {
        const half = len >> 1;
        const ang = (inverse ? 2 : -2) * Math.PI / len;
        const wRe = Math.cos(ang), wIm = Math.sin(ang);
        for (let i = 0; i < n; i += len) {
          let curRe = 1, curIm = 0;
          for (let k = 0; k < half; k++) {
            const aRe = re[i + k], aIm = im[i + k];
            const bRe = re[i + k + half] * curRe - im[i + k + half] * curIm;
            const bIm = re[i + k + half] * curIm + im[i + k + half] * curRe;
            re[i + k] = aRe + bRe;
            im[i + k] = aIm + bIm;
            re[i + k + half] = aRe - bRe;
            im[i + k + half] = aIm - bIm;
            const nextRe = curRe * wRe - curIm * wIm;
            curIm = curRe * wIm + curIm * wRe;
            curRe = nextRe;
          }
        }
      }
      if (inverse) {
        for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
      }
    }

    function fft2d(re, im, w, h, inverse) {
      const rowRe = new Float32Array(w);
      const rowIm = new Float32Array(w);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          rowRe[x] = re[y * w + x];
          rowIm[x] = im[y * w + x];
        }
        fft1d(rowRe, rowIm, w, inverse);
        for (let x = 0; x < w; x++) {
          re[y * w + x] = rowRe[x];
          im[y * w + x] = rowIm[x];
        }
      }
      const colRe = new Float32Array(h);
      const colIm = new Float32Array(h);
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          colRe[y] = re[y * w + x];
          colIm[y] = im[y * w + x];
        }
        fft1d(colRe, colIm, h, inverse);
        for (let y = 0; y < h; y++) {
          re[y * w + x] = colRe[y];
          im[y * w + x] = colIm[y];
        }
      }
    }

    function boxBlur2D(src, w, h, radius) {
      const tmp = new Float32Array(w * h);
      const out = new Float32Array(w * h);
      const size = radius * 2 + 1;
      for (let y = 0; y < h; y++) {
        let sum = 0;
        for (let x = -radius; x <= radius; x++) sum += src[y * w + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          tmp[y * w + x] = sum / size;
          sum -= src[y * w + Math.max(0, Math.min(w - 1, x - radius))];
          sum += src[y * w + Math.max(0, Math.min(w - 1, x + radius + 1))];
        }
      }
      for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let y = -radius; y <= radius; y++) sum += tmp[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          out[y * w + x] = sum / size;
          sum -= tmp[Math.max(0, Math.min(h - 1, y - radius)) * w + x];
          sum += tmp[Math.max(0, Math.min(h - 1, y + radius + 1)) * w + x];
        }
      }
      return out;
    }

    function erodeMask(src, w, h) {
      const out = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (
            src[y * w + x] &&
            (x === 0 || src[y * w + x - 1]) &&
            (x === w - 1 || src[y * w + x + 1]) &&
            (y === 0 || src[(y - 1) * w + x]) &&
            (y === h - 1 || src[(y + 1) * w + x])
          ) {
            out[y * w + x] = 1;
          }
        }
      }
      return out;
    }

    /* ============================================================
       SALIENCY (Hou & Zhang spectral residual)
       ============================================================ */
    function computeSaliency(pixelLCH, w, h, edgeFalloffPct = 10) {
      const fftW = nextPow2(w);
      const fftH = nextPow2(h);
      const fftN = fftW * fftH;

      // Hann window: 1 at center, 0 at edges. Removes FFT wrap-around artifacts.
      const winX = new Float32Array(w);
      const winY = new Float32Array(h);
      for (let x = 0; x < w; x++) {
        winX[x] = w > 1 ? 0.5 * (1 - Math.cos(2 * Math.PI * x / (w - 1))) : 1;
      }
      for (let y = 0; y < h; y++) {
        winY[y] = h > 1 ? 0.5 * (1 - Math.cos(2 * Math.PI * y / (h - 1))) : 1;
      }

      // Subtract mean luminance before windowing so windowing doesn't introduce
      // a fake gradient (zeros at edges + nonzero mean = phantom edges).
      let lumMean = 0;
      for (let i = 0; i < w * h; i++) lumMean += pixelLCH[i * 3];
      lumMean /= w * h;

      const re = new Float32Array(fftN);
      const im = new Float32Array(fftN);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const lum = pixelLCH[(y * w + x) * 3] - lumMean;
          re[y * fftW + x] = lum * winX[x] * winY[y];
        }
      }

      fft2d(re, im, fftW, fftH, false);

      const logMag = new Float32Array(fftN);
      const phase = new Float32Array(fftN);
      for (let i = 0; i < fftN; i++) {
        const mag = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
        logMag[i] = Math.log(mag + 1e-8);
        phase[i] = Math.atan2(im[i], re[i]);
      }

      const avgLogMag = boxBlur2D(logMag, fftW, fftH, 1);

      for (let i = 0; i < fftN; i++) {
        const residualMag = Math.exp(logMag[i] - avgLogMag[i]);
        re[i] = residualMag * Math.cos(phase[i]);
        im[i] = residualMag * Math.sin(phase[i]);
      }

      fft2d(re, im, fftW, fftH, true);

      const saliencyRaw = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const v = re[y * fftW + x];
          const u = im[y * fftW + x];
          saliencyRaw[y * w + x] = v * v + u * u;
        }
      }

      const saliencySmoothed = boxBlur2D(saliencyRaw, w, h, 2);

      // Edge falloff: dampen residual saliency near the borders. The
      // edgeFalloffPct slider sets the WIDTH of the dampened band as a
      // percentage of each axis. Inside (1 - f) of center: untouched
      // plateau (multiplier 1). Outside: cosine ramp from 1 down to 0
      // at the very edge. At f = 0 nothing is dampened; at f = 1 the
      // whole frame is under a single Hann window. The 2D multiplier
      // is the product of the per-axis curves.
      //
      // Why this exists at all: spectral-residual saliency has known
      // border ringing artifacts that can read as phantom subjects.
      // Some dampening kills those; too much dampening also kills real
      // subjects that happen to live near the edge of the frame, hence
      // the slider.
      const f = Math.max(0, Math.min(1, edgeFalloffPct / 100));
      if (f > 0 && w > 1 && h > 1) {
        const cx = (w - 1) / 2;
        const cy = (h - 1) / 2;
        const plateauEnd = 1 - f;
        const falloffMult = r => {
          if (r <= plateauEnd) return 1;
          const t = (r - plateauEnd) / f;  // 0 at plateau edge, 1 at frame edge
          return 0.5 + 0.5 * Math.cos(Math.PI * t);
        };
        for (let y = 0; y < h; y++) {
          const my = falloffMult(Math.abs((y - cy) / cy));
          for (let x = 0; x < w; x++) {
            const mx = falloffMult(Math.abs((x - cx) / cx));
            saliencySmoothed[y * w + x] *= mx * my;
          }
        }
      }

      let salMin = Infinity, salMax = -Infinity;
      for (let i = 0; i < w * h; i++) {
        if (saliencySmoothed[i] < salMin) salMin = saliencySmoothed[i];
        if (saliencySmoothed[i] > salMax) salMax = saliencySmoothed[i];
      }
      const salRange = salMax - salMin || 1;
      for (let i = 0; i < w * h; i++) {
        saliencySmoothed[i] = (saliencySmoothed[i] - salMin) / salRange;
      }

      return saliencySmoothed;
    }

    /* ============================================================
       PIPELINE
       ============================================================ */
    function run() {
      const fileInput = $('fileInput');
      const url = $('urlInput').value.trim();
      const maxW = Math.max(1, parseInt($('sizeInput').value, 10) || 30);
      // In Selection mode, leave the origin null so paintArt.gs resolves
      // it from the active spreadsheet selection. In Coordinates mode,
      // read the user-entered cell address.
      const positionMode = document.querySelector('input[name="positionMode"]:checked').value;
      const startCol = positionMode === 'coordinates'
        ? (parseColumnInput($('posX').value) || 1)
        : null;
      const startRow = positionMode === 'coordinates'
        ? Math.max(1, parseInt($('posY').value, 10) || 1)
        : null;

      if (fileInput.files.length > 0) {
        // 10 MB cap on uploaded images. Above this, the sidebar's
        // canvas decode starts risking out-of-memory on weaker
        // machines and the upload latency feels broken — and the
        // grid downsamples to at most 400 cells per side anyway,
        // so source pixels beyond a few megapixels add nothing.
        // Surfaced as a status-bar error using the same icon and
        // styling as other errors; user has to pick a smaller
        // file (or downsample) before retrying.
        const file = fileInput.files[0];
        const MAX_IMAGE_BYTES = 10 * 1024 * 1024;
        if (file.size > MAX_IMAGE_BYTES) {
          setStatus(
            'Image too large: ' + (file.size / 1024 / 1024).toFixed(1)
              + ' MB. Max 10 MB.',
            'error'
          );
          return;
        }
        setStatus('Reading file', 'pending');
        const reader = new FileReader();
        reader.onload = e => processImage(e.target.result, maxW, startRow, startCol);
        reader.onerror = () => setStatus('Failed to read file', 'error');
        reader.readAsDataURL(file);
      } else if (url) {
        setStatus('Fetching image', 'pending');
        google.script.run
          .withSuccessHandler(dataUrl => processImage(dataUrl, maxW, startRow, startCol))
          .withFailureHandler(err => setStatus('Fetch failed: ' + err.message, 'error'))
          .fetchImageAsDataUrl(url);
      } else {
        setStatus('Upload an image or enter a URL');
      }
    }

    /* Resets the user's current selection in the sheet to a clean default:
       white background, no content, no borders, unmerged, default cell size.
       Acts on whatever the user has selected in the Sheets UI. */
    function resetSheet() {
      setStatus('Resetting', 'pending');
      google.script.run
        .withSuccessHandler(() => {
          setStatus('');
        })
        .withFailureHandler(err => setStatus('Reset failed: ' + err.message, 'error'))
        .resetPaintedAreas();
    }

    /* ============================================================
       Shape-preserving copy / paste

       Sidesteps Sheets' clipboard, which can't carry a non-contiguous
       selection across rows. copyArt asks the backend to snapshot every
       painted cell in the active selection (bg ≠ default white or
       non-empty value); pasteArt sends the snapshot back with the user's
       current cell as the target origin. The backend overlays only the
       painted source cells on top of whatever's at the destination, so
       hide-on-blank gaps in the source don't wipe out destination art.

       The clipboard lives in this sidebar's memory only — closing the
       sidebar drops it. That's intentional; persistence would mean
       round-tripping through PropertiesService on every op.
       ============================================================ */
    let clipboard = null;

    function copyArt() {
      setStatus('Copying', 'pending');
      google.script.run
        .withSuccessHandler(snap => {
          if (!snap) {
            clipboard = null;
            $('pasteBtn').disabled = true;
            setStatus('Nothing painted to copy', 'error');
            return;
          }
          clipboard = snap;
          $('pasteBtn').disabled = false;
          setStatus(`Copied ${snap.cells.length} cells`);
        })
        .withFailureHandler(err => setStatus('Copy failed: ' + err.message, 'error'))
        .copySelection();
    }

    function pasteArt() {
      if (!clipboard) return;
      setStatus('Pasting', 'pending');
      google.script.run
        .withSuccessHandler(r => {
          if (!r) {
            setStatus('Nothing selected to paste into', 'error');
            return;
          }
          setStatus(`Pasted ${r.painted} cells`);
          // Same focus shift as paintArt — the destination range was
          // activated server-side but won't show as a visible selection
          // until focus leaves the sidebar.
          google.script.host.editor.focus();
        })
        .withFailureHandler(err => setStatus('Paste failed: ' + err.message, 'error'))
        .pasteShape(clipboard);
    }

    function clampSize(val, fallback) {
      const v = parseInt(val, 10);
      if (isNaN(v)) return fallback;
      return Math.max(1, v);
    }

    function downsampleImageGPU(img, dstW, dstH) {
      // Browser-resampled path. Uses canvas with imageSmoothingQuality
      // hint; produces smooth output but may vary slightly between runs
      // due to GPU implementation details.
      const canvas = $('canvas');
      canvas.width = dstW;
      canvas.height = dstH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'low';
      ctx.clearRect(0, 0, dstW, dstH);
      ctx.drawImage(img, 0, 0, dstW, dstH);
      return ctx.getImageData(0, 0, dstW, dstH).data;
    }

    // Cache the most recent resampled pixel buffer so paints with the
    // same image + target width reuse it instead of re-running
    // downsampleImageGPU, which is nondeterministic by design (canvas +
    // imageSmoothingQuality on the GPU returns slightly different bytes
    // each call). Without this, repainting after a Mapping toggle change
    // ends up with subtly different source pixels and therefore subtly
    // different palette matches — looks like a state bug in the LCH
    // stretch logic but is purely upstream of it. One-entry cache:
    // switching images or widths invalidates.
    let lastSampleSig = null;
    let lastSampleData = null;

    function processImage(dataUrl, maxW, startRow, startCol) {
      const img = new Image();
      img.onload = () => {
        const w = Math.min(maxW, img.naturalWidth);
        const h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));

        const sig = w + 'x' + h + '|' + dataUrl;
        let data;
        if (lastSampleSig === sig && lastSampleData) {
          data = lastSampleData;
        } else {
          data = downsampleImageGPU(img, w, h);
          lastSampleSig = sig;
          lastSampleData = data;
        }

        const pixelLCH = new Float32Array(w * h * 3);
        let imgMinL = Infinity, imgMaxL = -Infinity;
        let imgMinC = Infinity, imgMaxC = -Infinity;
        for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
          const [L, a, b] = srgbToOklab(data[i], data[i+1], data[i+2]);
          const C = Math.sqrt(a*a + b*b);
          const H = Math.atan2(b, a);
          pixelLCH[j] = L; pixelLCH[j+1] = C; pixelLCH[j+2] = H;
          if (L < imgMinL) imgMinL = L; if (L > imgMaxL) imgMaxL = L;
          if (C < imgMinC) imgMinC = C; if (C > imgMaxC) imgMaxC = C;
        }

        // Active palettes for this paint. If the picker is on "Default"
        // these point at PALETTE / TEXT_PALETTE; if it's on "Custom" and
        // the input parses to at least one valid color, these point at
        // the user's list converted to {L, a, b, hex} form.
        // Bg palette resolution — built from the modal's swatch
        // selections. If the user deselected everything we fall back
        // to PALETTE so paint doesn't crash with an empty palette.
        const bgRowsPalette = getActiveBgPalette();
        const bgPalette = bgRowsPalette.length ? bgRowsPalette : PALETTE;
        // Symbol palette: same shape as bg, sourced from the symbol
        // modal's selection map. Falls back to TEXT_PALETTE if empty.
        const symbolRowsPalette = getActivePaletteForMap(symbolRowSelections);
        const textPalette = symbolRowsPalette.length ? symbolRowsPalette : TEXT_PALETTE;

        // Per-section palette mode — 'preset' (default; nearest-match
        // against the palette) or 'spectrum' (each cell's source
        // pixel is used directly, no palette quantization). Set by
        // the Preset/Spectrum tab in each modal; read here to drive
        // a branch at every nearest() call site below.
        const bgSpectrum         = $('bgPalettePicker').dataset.paletteMode === 'spectrum';
        const textSpectrum       = $('textPalettePicker').dataset.paletteMode === 'spectrum';
        const bgAccentSpectrum   = $('bgSecondaryPicker').dataset.paletteMode === 'spectrum';
        const textAccentSpectrum = $('textSecondaryPicker').dataset.paletteMode === 'spectrum';
        const silSpectrum        = $('silhouettePalettePicker').dataset.paletteMode === 'spectrum';
        const conSpectrum        = $('contourPalettePicker').dataset.paletteMode === 'spectrum';

        // Spectrum-mode replacement for nearest(): builds a palette-
        // entry-shaped object {L, a, b, hex} from the source RGB at
        // the given pixel index, so downstream consumers (which all
        // read .hex, sometimes also L/a/b) work without branching
        // their own structure. Hex comes straight from the raw byte
        // values in data; L/a/b are recovered from the LCH precompute
        // (cheap — just one sin/cos pair) to keep the shape honest.
        const spectrumEntryAt = idx => {
          const i = idx * 4;
          const r = data[i], g = data[i+1], bb = data[i+2];
          const j = idx * 3;
          const L = pixelLCH[j];
          const C = pixelLCH[j+1];
          const H = pixelLCH[j+2];
          const hex = '#' +
            ('0' + r.toString(16)).slice(-2).toUpperCase() +
            ('0' + g.toString(16)).slice(-2).toUpperCase() +
            ('0' + bb.toString(16)).slice(-2).toUpperCase();
          return { L: L, a: C * Math.cos(H), b: C * Math.sin(H), hex: hex };
        };

        let palMinL = Infinity, palMaxL = -Infinity;
        let palMinC = Infinity, palMaxC = -Infinity;
        for (const p of bgPalette) {
          const C = Math.sqrt(p.a*p.a + p.b*p.b);
          if (p.L < palMinL) palMinL = p.L; if (p.L > palMaxL) palMaxL = p.L;
          if (C < palMinC) palMinC = C; if (C > palMaxC) palMaxC = C;
        }

        // Same ranges for the text palette, used by the glyph color stretch
        // toggles. Kept separate because bg and text palettes can be
        // different so their L/C/H extents don't necessarily match.
        let textPalMinL = Infinity, textPalMaxL = -Infinity;
        let textPalMinC = Infinity, textPalMaxC = -Infinity;
        for (const p of textPalette) {
          const C = Math.sqrt(p.a*p.a + p.b*p.b);
          if (p.L < textPalMinL) textPalMinL = p.L; if (p.L > textPalMaxL) textPalMaxL = p.L;
          if (C < textPalMinC) textPalMinC = C; if (C > textPalMaxC) textPalMaxC = C;
        }

        const remap = (val, inMin, inMax, outMin, outMax) => {
          if (inMax - inMin < 1e-6) return (outMin + outMax) / 2;
          return outMin + (val - inMin) * (outMax - outMin) / (inMax - inMin);
        };

        const stretchL = $('stretchL').checked;
        const stretchC = $('stretchC').checked;
        const stretchH = $('stretchH').checked;
        // Independent stretch toggles for the glyph-color match. Default
        // unchecked so prior behavior (original pixel values) is preserved.
        const textStretchL = $('textStretchL').checked;
        const textStretchC = $('textStretchC').checked;
        const textStretchH = $('textStretchH').checked;
        const paintStyle = $('paintStyle').value;
        // Background toggle: when off, every cell gets plain white instead of
        // a matched palette color (yields a "line art on white" look when
        // Glyphs is still on). Read once per paint.
        const bgOn = $('bgToggle').checked;
        // Lighten path is gone — checkerAmount is no longer read from a
        // DOM input. Kept as a constant 0 so existing alt-cell code paths
        // that branch on bgSecondaryPalette still compile, but with a
        // working accent palette always provided (fallback below) the
        // lighten branches are unreachable in practice.
        const checkerAmount = 0;
        // Bg accent palette — alternate cells (checker / stripe / ripple /
        // sunburst) get matched against this palette. Falls back to the
        // primary bg palette if the user clears all rows in the accent
        // modal, which guarantees a non-null palette so the (now dead)
        // lighten branches downstream never fire.
        const bgAccentRowsPalette = getActivePaletteForMap(bgAccentRowSelections);
        const bgSecondaryPalette = bgAccentRowsPalette.length ? bgAccentRowsPalette : bgPalette;
        const textPaintStyle = $('textPaintStyle').value;
        const textCheckerAmount = 0;
        // Text accent palette: same contract as bg accent — falls back to
        // the symbol palette when empty so the matcher always has data.
        const textAccentRowsPalette = getActivePaletteForMap(textAccentRowSelections);
        const textSecondaryPalette = textAccentRowsPalette.length ? textAccentRowsPalette : textPalette;

        // Saliency-centroid for Ripple/Sunburst: the weighted center of mass
        // of the saliency map. Defaults to the geometric center; lazily
        // computed below if either Center on Subject toggle is on. The
        // saliency map is computed further down for the subject-mask path
        // and reused here.
        const bgCenterOnSubject = $('bgCenterOnSubject').checked;
        const textCenterOnSubject = $('textCenterOnSubject').checked;
        // Hide-on-blank: when on (the default), cells whose source pixel
        // reads as blank get skipped (background falls back to white,
        // glyph is empty). "Blank" means transparent (alpha < 128) or
        // near-white (all three channels >= 250) — covers both cutout
        // PNGs and white-background source images. Semi-transparent
        // pixels still count as "present" so anti-aliased PNG edges
        // aren't lost. The two toggles are independent.
        // Blank-areas segmented (per-section) → boolean. "skip" = preserve
        // existing bg / draw no glyph on blanks (the old hide-on-blank=true
        // default); "fill" = paint a primary match / draw a glyph anyway,
        // like every other pixel. The rest of the pipeline still keys off
        // these booleans, so the segmented swap is a UI change only.
        const bgHideOnBlank = document.querySelector('input[name="bgBlankAreas"]:checked').value === 'skip';
        const textHideOnBlank = document.querySelector('input[name="textBlankAreas"]:checked').value === 'skip';

        let imgMinH = Infinity, imgMaxH = -Infinity;
        let palMinH = Infinity, palMaxH = -Infinity;
        let textPalMinH = Infinity, textPalMaxH = -Infinity;
        // Image hue range is computed unconditionally — one loop over
        // pixelLCH, cheap (w*h Float32 reads) — so consumers in the
        // border setup block can flip their stretchH toggles without
        // an upstream gate. Palette H ranges remain gated since each
        // palette has its own toggle.
        for (let j = 2; j < pixelLCH.length; j += 3) {
          if (pixelLCH[j] < imgMinH) imgMinH = pixelLCH[j];
          if (pixelLCH[j] > imgMaxH) imgMaxH = pixelLCH[j];
        }
        if (stretchH) {
          for (const p of bgPalette) {
            const H = Math.atan2(p.b, p.a);
            if (H < palMinH) palMinH = H;
            if (H > palMaxH) palMaxH = H;
          }
        }
        if (textStretchH) {
          for (const p of textPalette) {
            const H = Math.atan2(p.b, p.a);
            if (H < textPalMinH) textPalMinH = H;
            if (H > textPalMaxH) textPalMaxH = H;
          }
        }

        // Accent-palette gamuts. When an alternate cell is matched
        // against the Accent palette, the Mapping stretch should target
        // the accent's own L/C/H range — not the primary's — so the
        // mapped pixels fill the accent's gamut rather than bunching up
        // in whatever part of it overlaps the primary's range. Computed
        // per section; null in Lighten mode (no accent palette). The
        // stretch toggles stay shared with the primary.
        const bgSecGamut   = bgSecondaryPalette   ? paletteGamut(bgSecondaryPalette)   : null;
        const textSecGamut = textSecondaryPalette ? paletteGamut(textSecondaryPalette) : null;

        // Maps the pixel at offset j into a palette gamut on the axes
        // whose stretch toggle is on, returning the {L, a, b} triple for
        // nearest(). Image-side ranges are shared; only the output gamut
        // differs, which is what lets the accent match in its own range.
        const stretchInto = (j, onL, onC, onH, g) => {
          const L = onL ? remap(pixelLCH[j],   imgMinL, imgMaxL, g.minL, g.maxL) : pixelLCH[j];
          const C = onC ? remap(pixelLCH[j+1], imgMinC, imgMaxC, g.minC, g.maxC) : pixelLCH[j+1];
          const H = onH ? remap(pixelLCH[j+2], imgMinH, imgMaxH, g.minH, g.maxH) : pixelLCH[j+2];
          return { L, a: C * Math.cos(H), b: C * Math.sin(H) };
        };

        // ====================================================
        // Saliency-based subject detection
        // ====================================================
        const edgeFalloffPct = parseInt($('edgeFalloffInput').value, 10);
        const saliency = computeSaliency(pixelLCH, w, h, isNaN(edgeFalloffPct) ? 10 : edgeFalloffPct);

        // Saliency-weighted centroid: weighted center of mass over the
        // saliency map. Used as the pattern center when "Center on subject"
        // is enabled for Ripple or Sunburst. If saliency is uniform (no
        // strong subject), this lands near the geometric center anyway, so
        // there's a graceful degradation.
        let salCx = (w - 1) / 2;
        let salCy = (h - 1) / 2;
        if (bgCenterOnSubject || textCenterOnSubject) {
          let sumS = 0, sumX = 0, sumY = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const s = saliency[y * w + x];
              sumS += s;
              sumX += x * s;
              sumY += y * s;
            }
          }
          if (sumS > 0) {
            salCx = sumX / sumS;
            salCy = sumY / sumS;
          }
        }
        // Resolved per-channel centers; passed to ripplePhase/sunburstPhase.
        const bgPatternCx = bgCenterOnSubject ? salCx : (w - 1) / 2;
        const bgPatternCy = bgCenterOnSubject ? salCy : (h - 1) / 2;
        const textPatternCx = textCenterOnSubject ? salCx : (w - 1) / 2;
        const textPatternCy = textCenterOnSubject ? salCy : (h - 1) / 2;

        let salMean = 0;
        for (let i = 0; i < w * h; i++) salMean += saliency[i];
        salMean /= w * h;
        let salVar = 0;
        for (let i = 0; i < w * h; i++) {
          const d = saliency[i] - salMean;
          salVar += d * d;
        }
        const salStd = Math.sqrt(salVar / (w * h));

        // Threshold input is a "{n}%" string; parseInt ignores the
        // suffix. The percent is INVERTED before mapping to std-devs
        // so that higher % means more pixels qualify (looser cutoff)
        // — matches the intuition of "threshold = how much subject
        // gets through." 100% → 0 std-dev offset (everything above
        // the mean is foreground); 0% → 3 std-dev offset (only the
        // strongest saliency survives); 67% → 0.99 std-dev,
        // indistinguishable from the codebase's prior default of 1.0.
        const thresholdPct = parseInt($('thresholdInput').value, 10);
        const thresholdK = (100 - (isNaN(thresholdPct) ? 67 : thresholdPct)) * 0.03;
        const salThreshold = Math.min(0.99, salMean + thresholdK * salStd);

        let subjectMask = new Uint8Array(w * h);
        for (let i = 0; i < w * h; i++) {
          subjectMask[i] = saliency[i] >= salThreshold ? 1 : 0;
        }

        if ($('maskErosion').checked) {
          subjectMask = erodeMask(erodeMask(subjectMask, w, h), w, h);
        }

        // ====================================================
        // Glyphs strategy: branches on the user's Style choice.
        // Both branches expose the same { glyphFor(idx), sizeFor(idx) }
        // interface so the cell-assembly loop stays uniform.
        // ====================================================
        const style = $('glyphStyle').value;

        let glyphFor, sizeFor;

        if (style === 'binary') {
          const fgGlyph = $('fgGlyph').value || '⬤';
          const bgGlyph = $('bgGlyph').value || '✦';
          const fgSizeMin = clampSize($('fgSizeMin').value, 6);
          const fgSizeMax = clampSize($('fgSizeMax').value, 10);
          const bgSizeMin = clampSize($('bgSizeMin').value, 2);
          const bgSizeMax = clampSize($('bgSizeMax').value, 10);

          glyphFor = idx => subjectMask[idx] ? fgGlyph : bgGlyph;
          sizeFor = idx => {
            const sal = saliency[idx];
            if (subjectMask[idx]) {
              if (fgSizeMin === fgSizeMax) return fgSizeMax;
              // Map [salThreshold, 1] -> [fgSizeMin, fgSizeMax]
              const t = salThreshold >= 1 ? 1 : (sal - salThreshold) / (1 - salThreshold);
              const tt = Math.max(0, Math.min(1, t));
              return Math.round(fgSizeMin + tt * (fgSizeMax - fgSizeMin));
            } else {
              if (bgSizeMin === bgSizeMax) return bgSizeMin;
              const t = salThreshold > 0 ? Math.min(1, sal / salThreshold) : 0;
              return Math.round(bgSizeMin + t * (bgSizeMax - bgSizeMin));
            }
          };
        } else {
          // Continuous: characters from a single string distributed across
          // the normalized saliency range. First char = highest saliency
          // (most subject-like), last char = lowest (most background-like).
          // Operates on Array.from() to handle multi-codepoint chars properly.
          const symbolsStr = $('continuousSymbols').value || '⬤◐○·';
          const chars = Array.from(symbolsStr);
          const N = chars.length;
          const sizeMin = clampSize($('continuousSizeMin').value, 2);
          const sizeMax = clampSize($('continuousSizeMax').value, 10);

          // Find saliency range across the whole image so buckets span the
          // actual distribution, not the theoretical [0,1].
          let salMin = Infinity, salMax = -Infinity;
          for (let i = 0; i < w * h; i++) {
            const s = saliency[i];
            if (s < salMin) salMin = s;
            if (s > salMax) salMax = s;
          }
          const salRange = salMax - salMin || 1;

          const normalize = idx => (saliency[idx] - salMin) / salRange;

          glyphFor = idx => {
            const t = normalize(idx);
            // Higher saliency -> earlier character. Bucket index = floor((1-t)*N).
            const bucket = Math.min(N - 1, Math.floor((1 - t) * N));
            return chars[bucket];
          };
          sizeFor = idx => {
            if (sizeMin === sizeMax) return sizeMax;
            const t = normalize(idx);
            // Higher saliency = bigger size.
            return Math.round(sizeMin + t * (sizeMax - sizeMin));
          };
        }

        // ====================================================
        // Saliency-driven cell sizing
        // Sheets requires uniform widths along a column and uniform heights
        // along a row. When the Cell Size section is enabled, aggregate
        // saliency per column (max) and per row, then map normalized values
        // through an exponential curve to a pixel size.
        // ====================================================
        let colWidths = null;
        let rowHeights = null;

        if ($('cellSizeToggle').checked) {
          const resizeBy = $('cellSizeResizeBy').value;
          const CELL_SIZE_MIN = 21;
          const maxWidth = Math.max(CELL_SIZE_MIN, parseInt($('cellMaxWidth').value, 10) || 50);
          const maxHeight = Math.max(CELL_SIZE_MIN, parseInt($('cellMaxHeight').value, 10) || 50);
          // Curve base. 1 would divide by log(1)=0, so we clamp just above.
          const scale = Math.max(1.000001, parseFloat($('cellScaleInput').value) || 1.5);

          if (resizeBy === 'saliency') {
            const colMetric = new Float32Array(w);
            const rowMetric = new Float32Array(h);
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const s = saliency[y * w + x];
                if (s > colMetric[x]) colMetric[x] = s;
                if (s > rowMetric[y]) rowMetric[y] = s;
              }
            }

            // Normalize per-axis to [0, 1] so the most-salient col/row always
            // reaches max, regardless of the absolute saliency distribution.
            const normalize = arr => {
              let lo = Infinity, hi = -Infinity;
              for (const v of arr) { if (v < lo) lo = v; if (v > hi) hi = v; }
              const range = hi - lo || 1;
              for (let i = 0; i < arr.length; i++) arr[i] = (arr[i] - lo) / range;
            };
            normalize(colMetric);
            normalize(rowMetric);

            // Exponential curve: size = MIN * scale^(s * STEPS). STEPS adjusts
            // so s=1 lands exactly at the max for that axis.
            const sizeMapper = (max) => {
              const steps = Math.log(max / CELL_SIZE_MIN) / Math.log(scale);
              return s => Math.round(CELL_SIZE_MIN * Math.pow(scale, s * steps));
            };
            const widthFor = sizeMapper(maxWidth);
            const heightFor = sizeMapper(maxHeight);

            colWidths = Array.from(colMetric, widthFor);
            rowHeights = Array.from(rowMetric, heightFor);
          }
        }

        // ====================================================
        // Border setup (two layers: Silhouette + Contour)
        // ====================================================
        // The Silhouette and Contour sidebar sections each run as
        // their own border layer with independent toggle, palette,
        // and style. A cell can carry bits from both layers (for
        // example a corner cell whose top side faces the canvas
        // edge AND whose right side faces a different region) —
        // paint applies the layers sequentially, so each side of
        // each cell ends up with whichever layer's color/style
        // claimed it.
        //
        // Layer definitions:
        //   Silhouette — sides facing a blank source pixel or the
        //                canvas edge. Outlines the painted area as
        //                a whole.
        //   Contour    — sides between two non-blank cells whose
        //                source colors sit far enough apart in
        //                OKLab to read as different regions.
        //                Detection runs on the raw downsampled
        //                pixels, not the palette-matched output,
        //                so two distinct source colors that
        //                collapse to the same palette entry still
        //                get a contour edge between them. Visually
        //                similar source colors fall under the
        //                threshold and merge.
        const silhouetteOn = $('silhouetteToggle').checked;
        const contourOn    = $('contourToggle').checked;
        const silhouetteStyle = $('silhouetteStyle').value;
        const contourStyle    = $('contourStyle').value;

        // Per-layer Mapping toggles. Each axis, when on, stretches
        // the source pixel's range to that layer's palette gamut
        // before nearest-match — mirrors bg's Mapping behavior.
        // The imgMinH/maxH precompute above is gated on any stretchH
        // being on, so we extend its condition further down to cover
        // these too.
        const silStretchL = $('silhouetteStretchL').checked;
        const silStretchC = $('silhouetteStretchC').checked;
        const silStretchH = $('silhouetteStretchH').checked;
        const conStretchL = $('contourStretchL').checked;
        const conStretchC = $('contourStretchC').checked;
        const conStretchH = $('contourStretchH').checked;

        // Per-layer palette. Each falls back to the single-color
        // default blue (sat row index 7) if the user clears every
        // row in that layer's modal, so border paint always has
        // something to match against.
        const silhouettePaletteRows = getActivePaletteForMap(silhouetteRowSelections);
        const silhouettePalette = silhouettePaletteRows.length
          ? silhouettePaletteRows
          : [BG_PALETTE_ROWS.find(r => r.id === 'sat').colors[7]];
        const contourPaletteRows = getActivePaletteForMap(contourRowSelections);
        const contourPalette = contourPaletteRows.length
          ? contourPaletteRows
          : [BG_PALETTE_ROWS.find(r => r.id === 'sat').colors[7]];

        // Per-layer palette gamuts for the Mapping stretch. Always
        // computed (cheap — palette sizes are tiny); stretchInto
        // reads them when the corresponding axis toggle is on.
        const silGamut = paletteGamut(silhouettePalette);
        const conGamut = paletteGamut(contourPalette);

        // Contour sensitivity → squared OKLab distance threshold.
        // Piecewise-linear in distance so the lower half of the
        // slider sweeps a wide "merge a lot" range and the upper
        // half fine-tunes near the strict end. The whole curve
        // skews toward merging — even 50% sits well above the
        // OKLab JND so visually-similar palette neighbors don't
        // tile a shape with hairline edges.
        //   pct=0   → 0.60 dist → 0.36   squared (very loose; only
        //                                          obviously different
        //                                          colors get an edge)
        //   pct=25  → 0.40 dist → 0.16   squared
        //   pct=50  → 0.20 dist → 0.04   squared (moderate)
        //   pct=75  → 0.11 dist → 0.0121 squared
        //   pct=100 → 0.02 dist → 0.0004 squared (very strict; every
        //                                         subtle transition
        //                                         counts)
        const sensPct = Math.max(0, Math.min(100,
          parseInt($('sensitivityInput').value, 10) || 50));
        const sensDist = sensPct <= 50
          ? 0.60 - (sensPct / 50) * 0.40
          : 0.20 - ((sensPct - 50) / 50) * 0.18;
        const regionEdgeMinDistSq = sensDist * sensDist;

        // Precompute blank-mask once. Both the cell loop (which
        // used to recompute this inline) and the border-mask
        // derivation read it. Uint8Array because we only need 0/1
        // per cell.
