        const isBlank = new Uint8Array(w * h);
        for (let i = 0; i < w * h; i++) {
          const ai = i * 4;
          if (data[ai + 3] < 128 ||
              (data[ai] >= 250 && data[ai + 1] >= 250 && data[ai + 2] >= 250)) {
            isBlank[i] = 1;
          }
        }

        // Source-pixel (L, a, b) per cell, derived from pixelLCH
        // by pulling C·cos(H) and C·sin(H) into Cartesian. Used by
        // the Contour layer's region-edge check below. NO stretch
        // applied — contour detection tracks the image's inherent
        // perceptual structure, independent of how the palette
        // gamut remaps it for paint. Flat Float32Array so the
        // per-edge distance check is three subtractions plus
        // three multiplies, no trig in the hot path.
        const pixelLab = new Float32Array(w * h * 3);
        for (let i = 0; i < w * h; i++) {
          const j = i * 3;
          const C = pixelLCH[j+1];
          const H = pixelLCH[j+2];
          pixelLab[j]   = pixelLCH[j];
          pixelLab[j+1] = C * Math.cos(H);
          pixelLab[j+2] = C * Math.sin(H);
        }

        // Precompute every cell's primary bg-palette match as the
        // full palette entry ({L, a, b, hex}). Used by the
        // cell-assembly loop below in place of the per-cell
        // nearest() call it used to make — the primary match is
        // computed once here and read out as .hex during paint.
        // Computed for every cell including blanks because some
        // configs (bg on, hide-on-blank off) paint a primary match
        // even into blank pixels.
        const primaryEntry = new Array(w * h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = y * w + x;
            if (bgSpectrum) {
              primaryEntry[idx] = spectrumEntryAt(idx);
              continue;
            }
            const j = idx * 3;
            const L = stretchL ? remap(pixelLCH[j],   imgMinL, imgMaxL, palMinL, palMaxL) : pixelLCH[j];
            const C = stretchC ? remap(pixelLCH[j+1], imgMinC, imgMaxC, palMinC, palMaxC) : pixelLCH[j+1];
            const H = stretchH ? remap(pixelLCH[j+2], imgMinH, imgMaxH, palMinH, palMaxH) : pixelLCH[j+2];
            const a = C * Math.cos(H);
            const b = C * Math.sin(H);
            primaryEntry[idx] = nearest(bgPalette, L, a, b);
          }
        }

        // Per-layer border masks. Mask bits: 1=top, 2=right,
        // 4=bottom, 8=left. The companion border-color 2D arrays
        // get filled inside the cell-assembly loop below, since
        // each cell's border color is matched against its FINAL
        // bg color (post pattern/lift) against the layer's own
        // palette. Layers ship to paintArt as a list and feed
        // sequential setBorder passes on the .gs side.
        const silhouetteBorders      = silhouetteOn ? [] : null;
        const silhouetteBorderColors = silhouetteOn ? [] : null;
        const contourBorders         = contourOn    ? [] : null;
        const contourBorderColors    = contourOn    ? [] : null;

        // Silhouette mask: for each non-blank cell, set a bit on
        // each side whose neighbor is blank or sits off the
        // canvas. Same shape as the original border-outline path.
        if (silhouetteOn) {
          for (let y = 0; y < h; y++) {
            const row = [];
            for (let x = 0; x < w; x++) {
              const idx = y * w + x;
              if (isBlank[idx]) { row.push(0); continue; }
              let mask = 0;
              if (y === 0     || isBlank[(y - 1) * w + x]) mask |= 1; // top
              if (x === w - 1 || isBlank[y * w + (x + 1)]) mask |= 2; // right
              if (y === h - 1 || isBlank[(y + 1) * w + x]) mask |= 4; // bottom
              if (x === 0     || isBlank[y * w + (x - 1)]) mask |= 8; // left
              row.push(mask);
            }
            silhouetteBorders.push(row);
          }
        }

        // Contour mask: for each non-blank cell, set a bit on
        // each side whose neighbor is non-blank and sits more
        // than regionEdgeMinDistSq away from this cell in
        // pixelLab. Blank neighbors and canvas edges are
        // silhouette territory — they aren't a region change,
        // they're where the painted area ends.
        if (contourOn) {
          const isRegionEdge = (i1, i2) => {
            const o1 = i1 * 3, o2 = i2 * 3;
            const dL = pixelLab[o1]   - pixelLab[o2];
            const da = pixelLab[o1+1] - pixelLab[o2+1];
            const db = pixelLab[o1+2] - pixelLab[o2+2];
            return (dL*dL + da*da + db*db) > regionEdgeMinDistSq;
          };
          for (let y = 0; y < h; y++) {
            const row = [];
            for (let x = 0; x < w; x++) {
              const idx = y * w + x;
              if (isBlank[idx]) { row.push(0); continue; }
              let mask = 0;
              if (y > 0) {
                const ni = (y - 1) * w + x;
                if (!isBlank[ni] && isRegionEdge(idx, ni)) mask |= 1;
              }
              if (x < w - 1) {
                const ni = y * w + (x + 1);
                if (!isBlank[ni] && isRegionEdge(idx, ni)) mask |= 2;
              }
              if (y < h - 1) {
                const ni = (y + 1) * w + x;
                if (!isBlank[ni] && isRegionEdge(idx, ni)) mask |= 4;
              }
              if (x > 0) {
                const ni = y * w + (x - 1);
                if (!isBlank[ni] && isRegionEdge(idx, ni)) mask |= 8;
              }
              row.push(mask);
            }
            contourBorders.push(row);
          }
        }

        // ====================================================
        // Cell assembly
        // ====================================================
        const colors = [];
        const symbols = [];
        const fontColors = [];
        const fontSizes = [];

        for (let y = 0; y < h; y++) {
          const colorRow = [];
          const symbolRow = [];
          const fontRow = [];
          const sizeRow = [];
          const silhouetteColorRow = silhouetteOn ? [] : null;
          const contourColorRow    = contourOn    ? [] : null;
          for (let x = 0; x < w; x++) {
            const j = (y * w + x) * 3;
            const idx = y * w + x;
            // Blank flag (transparent or near-white in source). Precomputed
            // above so the border mask can share the same definition.
            const blank = isBlank[idx] === 1;

            // Background match (uses stretched values)
            const L = stretchL ? remap(pixelLCH[j],   imgMinL, imgMaxL, palMinL, palMaxL) : pixelLCH[j];
            const C = stretchC ? remap(pixelLCH[j+1], imgMinC, imgMaxC, palMinC, palMaxC) : pixelLCH[j+1];
            const H = stretchH ? remap(pixelLCH[j+2], imgMinH, imgMaxH, palMinH, palMaxH) : pixelLCH[j+2];
            const a = C * Math.cos(H);
            const b = C * Math.sin(H);
            let bgHex;
            if (bgOn && !(blank && bgHideOnBlank)) {
              // Primary bg match — precomputed above into
              // primaryEntry, read out here as .hex for paint.
              // (Region-edge detection runs on the raw source
              // pixels via pixelLab, not on this match, so paint
              // and contour are independent.) The L/a/b values
              // are still computed for this cell because the
              // Accent branch below needs them; only the primary
              // nearest() call moved out.
              bgHex = primaryEntry[idx].hex;
              // Accent match runs on the pixel stretched into the Accent
              // palette's own gamut (bgSecGamut) rather than the primary
              // values above, so Mapping spreads it across the accent's
              // full range. Falls back to the primary triple in Lighten
              // mode, where altHex never reads it anyway.
              let sL = L, sa = a, sb = b;
              if (bgSecGamut) {
                const s = stretchInto(j, stretchL, stretchC, stretchH, bgSecGamut);
                sL = s.L; sa = s.a; sb = s.b;
              }
              // "Alternate" cell color: by default we lighten the primary
              // match (Lighten mode). When the user has chosen a secondary
              // palette, we match the source pixel against that palette
              // instead — yielding alternates with an independent color
              // identity rather than tinted variants. The altHex helper
              // hides the branch from each paint-style block below.
              const altHex = () => bgSecondaryPalette
                ? (bgAccentSpectrum
                    ? spectrumEntryAt(y * w + x).hex
                    : nearest(bgSecondaryPalette, sL, sa, sb).hex)
                : lightenHex(bgHex, checkerAmount);
              if (paintStyle === 'checkered' && ((x + y) & 1)) {
                // Two-tone alternation.
                bgHex = altHex();
              } else if (paintStyle === 'horizontal' && (y & 1)) {
                // Horizontal stripes.
                bgHex = altHex();
              } else if (paintStyle === 'vertical' && (x & 1)) {
                // Vertical stripes.
                bgHex = altHex();
              } else if (paintStyle === 'ripple') {
                // Three-tone radial bands. In Lighten mode: phase 0 = base,
                // phase 1 = half lift, phase 2 = full lift. In palette mode:
                // OKLCH-interpolate between the primary match and the
                // secondary match — phase 0 = pure primary, phase 1 = halfway,
                // phase 2 = pure secondary — preserving the three-tone feel.
                const phase = ripplePhase(x, y, bgPatternCx, bgPatternCy);
                if (phase > 0) {
                  if (bgSecondaryPalette) {
                    const secondaryHex = bgAccentSpectrum
                      ? spectrumEntryAt(y * w + x).hex
                      : nearest(bgSecondaryPalette, sL, sa, sb).hex;
                    bgHex = gradientHex(bgHex, secondaryHex, phase / 2);
                  } else {
                    bgHex = lightenHex(bgHex, checkerAmount * phase / 2);
                  }
                }
              } else if (paintStyle === 'sunburst') {
                // Two-tone sunburst: angular wedges with logarithmic twist.
                if (sunburstPhase(x, y, bgPatternCx, bgPatternCy)) {
                  bgHex = altHex();
                }
              }
            } else if (blank && bgHideOnBlank) {
              // Source pixel is blank AND hide-on-blank is on →
              // preserve whatever's already in the cell rather than
              // overwriting with white. Server-side, null cells in
              // the colors array get filled in from the range's
              // current backgrounds before setBackgrounds runs.
              bgHex = null;
            } else {
              // bg toggle is off → erase to white (explicit user choice
              // to clear bg for a line-art look).
              bgHex = '#FFFFFF';
            }
            colorRow.push(bgHex);

            // Border color matching, per layer. Each border-bearing
            // cell matches the SOURCE pixel (not the painted bgHex)
            // against the layer's own palette in OKLab space, with
            // optional per-axis stretch to the palette's gamut
            // controlled by that layer's Mapping checkboxes.
            // Mirrors the bg / text matching pattern, so the border
            // color tracks the image's perceptual structure rather
            // than whatever palette quantization the bg landed on —
            // and the Mapping row gives the same gamut-spread
            // control the user has elsewhere. Palettes are
            // guaranteed non-empty (each falls back to the default
            // blue when its modal selection is cleared).
            const needSil = silhouetteOn && silhouetteBorders[y][x];
            const needCon = contourOn    && contourBorders[y][x];
            if (silhouetteOn) {
              if (needSil) {
                if (silSpectrum) {
                  silhouetteColorRow.push(spectrumEntryAt(y * w + x).hex);
                } else {
                  const s = stretchInto(j, silStretchL, silStretchC, silStretchH, silGamut);
                  silhouetteColorRow.push(nearest(silhouettePalette, s.L, s.a, s.b).hex);
                }
              } else {
                silhouetteColorRow.push(null);
              }
            }
            if (contourOn) {
              if (needCon) {
                if (conSpectrum) {
                  contourColorRow.push(spectrumEntryAt(y * w + x).hex);
                } else {
                  const s = stretchInto(j, conStretchL, conStretchC, conStretchH, conGamut);
                  contourColorRow.push(nearest(contourPalette, s.L, s.a, s.b).hex);
                }
              } else {
                contourColorRow.push(null);
              }
            }

            // Text color match. Each axis can be independently stretched
            // from the image's range to the text palette's range via the
            // Mapping toggles in the Glyphs section. With all three off
            // (default), this uses the raw pixel values.
            const tL = textStretchL ? remap(pixelLCH[j],   imgMinL, imgMaxL, textPalMinL, textPalMaxL) : pixelLCH[j];
            const tC = textStretchC ? remap(pixelLCH[j+1], imgMinC, imgMaxC, textPalMinC, textPalMaxC) : pixelLCH[j+1];
            const tH = textStretchH ? remap(pixelLCH[j+2], imgMinH, imgMaxH, textPalMinH, textPalMaxH) : pixelLCH[j+2];
            const oa = tC * Math.cos(tH);
            const ob = tC * Math.sin(tH);
            let textHex = textSpectrum
              ? spectrumEntryAt(y * w + x).hex
              : nearest(textPalette, tL, oa, ob).hex;
            // Accent match for glyph color: the pixel stretched into the
            // text Accent palette's own gamut (textSecGamut) rather than
            // the primary text palette's. Same shared-toggle contract as
            // the bg side; falls back to the primary triple in Lighten
            // mode where altTextHex never reads it.
            let stL = tL, soa = oa, sob = ob;
            if (textSecGamut) {
              const s = stretchInto(j, textStretchL, textStretchC, textStretchH, textSecGamut);
              stL = s.L; soa = s.a; sob = s.b;
            }
            // Apply the text paint style. Independent of the background
            // pattern, though both share the same (x, y) grid so coordinated
            // visuals are easy to dial in. The altTextHex helper mirrors
            // the bg flow's altHex: in Lighten mode it lightens the primary
            // match; in palette mode it matches the source pixel against
            // the chosen secondary palette.
            const altTextHex = () => textSecondaryPalette
              ? (textAccentSpectrum
                  ? spectrumEntryAt(y * w + x).hex
                  : nearest(textSecondaryPalette, stL, soa, sob).hex)
              : lightenHex(textHex, textCheckerAmount);
            if (textPaintStyle === 'checkered' && ((x + y) & 1)) {
              textHex = altTextHex();
            } else if (textPaintStyle === 'horizontal' && (y & 1)) {
              textHex = altTextHex();
            } else if (textPaintStyle === 'vertical' && (x & 1)) {
              textHex = altTextHex();
            } else if (textPaintStyle === 'ripple') {
              // Three-tone ripple: in Lighten mode, half-then-full lift.
              // In palette mode, OKLCH lerp between primary and secondary
              // matches for a three-tone palette transition.
              const phase = ripplePhase(x, y, textPatternCx, textPatternCy);
              if (phase > 0) {
                if (textSecondaryPalette) {
                  const secondaryHex = textAccentSpectrum
                    ? spectrumEntryAt(y * w + x).hex
                    : nearest(textSecondaryPalette, stL, soa, sob).hex;
                  textHex = gradientHex(textHex, secondaryHex, phase / 2);
                } else {
                  textHex = lightenHex(textHex, textCheckerAmount * phase / 2);
                }
              }
            } else if (textPaintStyle === 'sunburst') {
              if (sunburstPhase(x, y, textPatternCx, textPatternCy)) {
                textHex = altTextHex();
              }
            }
            // For blank cells with text-hide-on-blank, push null in
            // every text-side array (glyph value, font color, font
            // size). The server merges nulls with the range's current
            // values so the cell's existing content + formatting are
            // preserved instead of being wiped to defaults.
            const hideText = blank && textHideOnBlank;
            fontRow.push(hideText ? null : textHex);
            symbolRow.push(hideText ? null : glyphFor(idx));
            sizeRow.push(hideText ? null : sizeFor(idx));
          }
          colors.push(colorRow);
          symbols.push(symbolRow);
          fontColors.push(fontRow);
          fontSizes.push(sizeRow);
          if (silhouetteOn) silhouetteBorderColors.push(silhouetteColorRow);
          if (contourOn) contourBorderColors.push(contourColorRow);
        }

        setStatus(`Painting ${w}×${h} cells`, 'pending');
        // Assemble the layer list for paintArt. Order matters
        // because layers paint sequentially and Sheets' setBorder
        // is last-write-wins on shared edges. Silhouette runs
        // first; Contour runs second so any contour edge that
        // happens to coincide with a silhouette edge (only really
        // happens at the very perimeter when a region touches the
        // canvas) shows the contour color/style on top. With
        // either toggle off, that layer is simply omitted.
        const borderLayers = [];
        if (silhouetteOn) {
          borderLayers.push({
            borders: silhouetteBorders,
            colors:  silhouetteBorderColors,
            style:   silhouetteStyle
          });
        }
        if (contourOn) {
          borderLayers.push({
            borders: contourBorders,
            colors:  contourBorderColors,
            style:   contourStyle
          });
        }

        // When the Glyphs section is toggled off, send nulls for the
        // per-cell text arrays — the .gs paintArt skips setValues /
        // setFontColors / setFontSizes when those args are falsy, so no
        // glyphs get drawn and the cells stay color-only.
        const glyphsOn = $('glyphsToggle').checked;
        google.script.run
          .withSuccessHandler(r => {
            setStatus('');
            // Shift focus from the sidebar back to the spreadsheet so the
            // server-side range.activate() in paintArt actually shows up as
            // a visible selection. Without this the selection model updates
            // but the UI doesn't repaint until the user clicks the sheet.
            google.script.host.editor.focus();
          })
          .withFailureHandler(err => setStatus('Paint failed: ' + err.message, 'error'))
          .paintArt(
            colors,
            glyphsOn ? symbols    : null,
            glyphsOn ? fontColors : null,
            glyphsOn ? fontSizes  : null,
            colWidths, rowHeights, startRow, startCol,
            borderLayers
          );
      };
      img.onerror = () => setStatus('Image decode failed', 'error');
      img.src = dataUrl;
    }

    init();
  </script>
</body>
</html>
